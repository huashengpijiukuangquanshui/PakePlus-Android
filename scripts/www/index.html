      const isBuiltin = getActivePlaylist().builtin;
      emptyTitle.textContent = isBuiltin ? '播放列表空空如也' : '歌单里还没有歌曲';
      emptyHint.innerHTML = isBuiltin
        ? '把音频/视频文件拖到窗口任意位置<br>或点击右上角 + 添加'
        : '从「全部歌曲」中长按或点右上角多选<br>选择歌曲后「新建歌单」加入';
      return;
    }

    playlistEl.style.display = '';
    emptyState.style.display = 'none';
    const curId = state.currentId;

    playlistEl.innerHTML = queue.map((t) => {
      const badge = t.type === 'video' ? '<span class="video-badge">MV</span>' : '';
      const cover = t.cover
        ? `<img src="${esc(t.cover)}" alt="" loading="lazy" decoding="async">`
        : NOTE_SVG;
      const sel = selection.active && selection.ids.has(t.id);
      return `
        <li class="track${t.id === curId ? ' active' : ''}${sel ? ' selected' : ''}" data-id="${esc(t.id)}">
          <span class="track-check" aria-hidden="true">${CHECK_SVG}</span>
          <div class="track-cover">${cover}${badge}</div>
          <div class="track-meta">
            <div class="track-title" title="${esc(t.title)}">${esc(t.title)}</div>
            <div class="track-artist" title="${esc(t.artist)}">${esc(t.artist)}</div>
          </div>
          <span class="track-dur">${t.duration ? fmtTime(t.duration) : '--:--'}</span>
          <button class="track-more" data-more="${esc(t.id)}" title="更多操作" aria-label="更多操作">
            ${MORE_SVG}
          </button>
        </li>`;
    }).join('');

    playlistEl.scrollTop = scrollTop;

    trackElMap.clear();
    activeTrackEl = null;
    playlistEl.querySelectorAll('.track').forEach((el) => {
      trackElMap.set(el.dataset.id, el);
      if (el.dataset.id === state.currentId) {
        el.classList.add('active');
        activeTrackEl = el;
      }
    });
  }

  function findTrackEl(id) {
    return trackElMap.get(id) || null;
  }

  function highlightActive() {
    if (activeTrackEl) activeTrackEl.classList.remove('active');
    activeTrackEl = null;
    if (!state.currentId) return;
    const el = trackElMap.get(state.currentId);
    if (el) {
      el.classList.add('active');
      activeTrackEl = el;
    }
  }

  function updatePlayState() {
    const media = getActiveMedia();
    const playing = !media.paused && !!media.src;
    playBtn.classList.toggle('playing', playing);
    playBtn.setAttribute('aria-label', playing ? '暂停' : '播放');
    playerEl.classList.toggle('is-playing', playing);
    if (tabDot) tabDot.hidden = !playing;
    if ('mediaSession' in navigator) {
      try { navigator.mediaSession.playbackState = playing ? 'playing' : 'paused'; } catch { /* 忽略 */ }
    }
  }

  function updateVolumeIcon() {
    const silent = state.muted || state.volume === 0;
    muteBtn.querySelector('.i-vol').style.display  = silent ? 'none' : '';
    muteBtn.querySelector('.i-mute').style.display = silent ? '' : 'none';
    muteBtn.style.color = silent ? 'var(--dim)' : '';
  }

  function updateModeButton() {
    modeBtn.dataset.mode = state.playMode;
    const label = MODE_LABELS[state.playMode];
    modeBtn.setAttribute('aria-label', `播放模式：${label}`);
    modeBtn.title = `播放模式：${label} (R)`;
  }

  function updateLoopButton() {
    const isLooping = state.playMode === 'all' || state.playMode === 'one';
    loopBtn.classList.toggle('active', isLooping);
    loopBtn.setAttribute('aria-pressed', isLooping ? 'true' : 'false');
    const label = isLooping ? '循环播放：开' : '循环播放：关';
    loopBtn.setAttribute('aria-label', label);
    loopBtn.title = `${label} (L)`;
  }

  function updatePlPickerLabel() {
    plPickerNameEl.textContent = getActivePlaylist().name;
  }

  /* =========================================================
   *  多选模式
   * ========================================================= */
  let suppressClick = false;
  let lpTimer = 0;
  let lpOrigin = null;

  function enterSelectMode(initialId) {
    const q = getQueue();
    if (!q.length) return;
    selection.active = true;
    selection.ids.clear();
    if (initialId) selection.ids.add(initialId);

    plHeaderEl.hidden = true;
    plSelectHeaderEl.hidden = false;
    selActionBar.hidden = false;

    renderPlaylist();
    updateSelectBar();
  }

  function exitSelectMode() {
    if (!selection.active) return;
    selection.active = false;
    selection.ids.clear();

    plHeaderEl.hidden = false;
    plSelectHeaderEl.hidden = true;
    selActionBar.hidden = true;

    renderPlaylist();
  }

  function updateSelectBar() {
    const n = selection.ids.size;
    const total = getQueue().length;
    selCountEl.innerHTML = `已选 <b>${n}</b> 首 <small>/ ${total}</small>`;
    selAllBtn.textContent = (n === total && total > 0) ? '取消全选' : '全选';
    selAddBtn.disabled = n === 0;
    selNewBtn.disabled = n === 0;
  }

  function toggleSelect(id) {
    if (selection.ids.has(id)) selection.ids.delete(id);
    else selection.ids.add(id);
    const el = trackElMap.get(id);
    if (el) el.classList.toggle('selected', selection.ids.has(id));
    updateSelectBar();
  }

  function toggleSelectAll() {
    const q = getQueue();
    if (selection.ids.size === q.length) selection.ids.clear();
    else q.forEach((t) => selection.ids.add(t.id));

    q.forEach((t) => {
      const el = trackElMap.get(t.id);
      if (el) el.classList.toggle('selected', selection.ids.has(t.id));
    });
    updateSelectBar();
  }

  function showAddToPlaylistSheet() {
    const ids = Array.from(selection.ids);
    if (!ids.length) { toast('请先选择歌曲'); return; }

    const customs = state.playlists.filter((p) => !p.builtin);
    let html = '<div class="menu-header">加入歌单</div>';
    if (!customs.length) {
      html += '<div class="menu-item" data-action="new"><span>还没有歌单，去新建一个…</span></div>';
    } else {
      customs.forEach((p) => {
        html += `<div class="menu-item" data-pl="${esc(p.id)}">
          <span>${esc(p.name)}</span>
          <span class="menu-count">${(p.trackIds || []).length} 首</span>
        </div>`;
      });
      html += '<div class="menu-sep"></div>';
      html += '<div class="menu-item" data-action="new"><span>＋ 新建歌单…</span></div>';
    }

    showPopup(selAddBtn, html, (e) => {
      const plEl = e.target.closest('[data-pl]');
      if (plEl) {
        closePopup();
        batchAddToPlaylist(plEl.dataset.pl, ids);
        return;
      }
      const act = e.target.closest('[data-action="new"]');
      if (act) {
        closePopup();
        openCreatePlaylistModal(ids);
      }
    }, { sheet: !isDesktop() });
  }

  function batchAddToPlaylist(plId, ids) {
    const pl = state.playlists.find((p) => p.id === plId);
    if (!pl || pl.builtin) return;
    if (!Array.isArray(pl.trackIds)) pl.trackIds = [];

    const set = new Set(pl.trackIds);
    let added = 0;
    ids.forEach((id) => {
      if (!getTrackById(id)) return;
      if (set.has(id)) return;
      pl.trackIds.push(id);
      set.add(id);
      added++;
    });

    savePlaylists();
    invalidateQueue();
    if (state.activePlaylistId === plId) {
      renderPlaylist();
      highlightActive();
    }
    exitSelectMode();
    toast(added ? `已将 ${added} 首加入“${pl.name}”` : `“${pl.name}”中已包含所选歌曲`);
  }

  /* =========================================================
   *  新建歌单弹窗
   * ========================================================= */
  let pendingCreateIds = [];

  function suggestPlaylistName() {
    const base = '我的歌单';
    if (!state.playlists.some((p) => p.name === base)) return base;
    let i = 2;
    while (state.playlists.some((p) => p.name === `${base} ${i}`)) i++;
    return `${base} ${i}`;
  }

  function openCreatePlaylistModal(ids) {
    pendingCreateIds = Array.isArray(ids) ? ids.slice() : [];
    createPlName.value = suggestPlaylistName();
    updateCreateModalState();
    createPlModal.hidden = false;
    setTimeout(() => {
      try {
        createPlName.focus();
        createPlName.select();
      } catch { /* 忽略 */ }
    }, 60);
  }

  function closeCreatePlaylistModal() {
    createPlModal.hidden = true;
    createPlName.value = '';
    pendingCreateIds = [];
  }

  function updateCreateModalState() {
    const raw = createPlName.value;
    const name = raw.trim();
    const len = raw.length;

    createPlCount.textContent = `${len}/40`;
    createPlCount.classList.toggle('warn', len >= 40);

    const exists = !!name && state.playlists.some((p) => p.name === name);
    const empty = !name;

    let hint;
    if (empty) {
      hint = pendingCreateIds.length
        ? `将添加 ${pendingCreateIds.length} 首歌曲`
        : '输入一个歌单名称';
    } else if (exists) {
      hint = '已存在同名歌单，请换一个名字';
    } else {
      hint = pendingCreateIds.length
        ? `将添加 ${pendingCreateIds.length} 首歌曲到新歌单`
        : '创建一个空歌单，稍后再添加歌曲';
    }

    createPlHint.textContent = hint;
    createPlHint.classList.toggle('error', !empty && exists);
    createPlOk.disabled = empty || exists;
  }

  function submitCreatePlaylist() {
    const name = createPlName.value.trim().slice(0, 40);
    if (!name) return;
    if (state.playlists.some((p) => p.name === name)) {
      toast('已存在同名歌单');
      return;
    }

    const ids = pendingCreateIds.filter((id) => !!getTrackById(id));
    const pl = createPlaylist(name);
    if (!pl) return;

    if (ids.length) {
      pl.trackIds = ids.slice();
      savePlaylists();
    }

    closeCreatePlaylistModal();
    if (selection.active) exitSelectMode();

    renderManageList();
    updatePlPickerLabel();
    invalidateQueue();
    switchPlaylist(pl.id);

    toast(ids.length
      ? `已创建“${pl.name}”，添加 ${ids.length} 首`
      : `已创建歌单“${pl.name}”`);
  }

  /* =========================================================
   *  进度
   * ========================================================= */
  let seekPreview = null;
  let lastBufferUpdate = 0;

  function updateProgress() {
    const media = getActiveMedia();
    const dur = media.duration;

    if (seekPreview === null) {
      const ratio = (isFinite(dur) && dur > 0) ? media.currentTime / dur : 0;
      const pct = Math.min(1, Math.max(0, ratio)) * 100;
      seekFill.style.width = pct + '%';
      seekBar.setAttribute('aria-valuenow', String(Math.round(pct)));
      seekBar.setAttribute('aria-valuetext', `${fmtTime(media.currentTime)} / ${fmtTime(dur)}`);
      curTimeEl.textContent = fmtTime(media.currentTime);

      const now = performance.now();
      if (now - lastBufferUpdate > 300) {
        lastBufferUpdate = now;
        try {
          if (isFinite(dur) && dur > 0 && media.buffered.length) {
            let end = 0;
            for (let i = 0; i < media.buffered.length; i++) {
              if (media.buffered.start(i) <= media.currentTime &&
                  media.buffered.end(i) >= media.currentTime) {
                end = media.buffered.end(i);
                break;
              }
            }
            if (!end) end = media.buffered.end(media.buffered.length - 1);
            bufFill.style.width = Math.min(100, (end / dur) * 100) + '%';
          }
        } catch { /* 忽略 */ }
      }
    }

    const durText = (isFinite(dur) && dur > 0) ? fmtTime(dur) : '0:00';
    if (durTimeEl.textContent !== durText) durTimeEl.textContent = durText;
  }

  let rafId = null;
  let lastRafDraw = 0;

  function rafLoop(ts) {
    if (!lastRafDraw || ts - lastRafDraw > 60) {
      lastRafDraw = ts;
      updateProgress();
    }
    if (!getActiveMedia().paused) rafId = requestAnimationFrame(rafLoop);
  }

  /* =========================================================
   *  播放
   * ========================================================= */
  function playIndex(index, autoplay = true) {
    const q = getQueue();
    if (index < 0 || index >= q.length) return;
    playTrack(q[index], autoplay);
  }

  function playById(id, autoplay = true) {
    const idx = getQueue().findIndex((t) => t.id === id);
    if (idx >= 0) playIndex(idx, autoplay);
  }

  function playTrack(track, autoplay = true) {
    if (!track) return;

    const prevCurrent = getCurrentTrack();
    const isSameSong = prevCurrent && (prevCurrent.id === track.id || prevCurrent.pairedId === track.id);
    if (prevCurrent && !isSameSong) {
      nextTheme();
      randomizeGalaxy();
    }

    if (!track.blob) {
      const prevId = state.currentId;
      if (prevId && prevId !== track.id) {
        playHistory.push(prevId);
        if (playHistory.length > 100) playHistory.shift();
      }
      if (activeMedia && !activeMedia.paused) {
        try { activeMedia.pause(); } catch { /* 忽略 */ }
      }
      state.currentId = track.id;
      seekPreview = null;
      updateNowPlayingUI();
      highlightActive();
      updatePlayState();
      updateMediaSession();
      saveSettings();

      const wantedId = track.id;
      ensureBlob(track).then((blob) => {
        if (!blob) { toast('文件数据已丢失，请重新添加该文件'); return; }
        if (state.currentId !== wantedId) return;
        playTrack(track, autoplay);
      });
      return;
    }

    const prevMedia = activeMedia;
    const prevTime = prevMedia ? prevMedia.currentTime : 0;
    const prevId = state.currentId;

    if (prevId && prevId !== track.id) {
      playHistory.push(prevId);
      if (playHistory.length > 100) playHistory.shift();
    }
    state.currentId = track.id;

    if (state.playMode === 'shuffle') {
      const qi = shuffleQueue.indexOf(track.id);
      if (qi >= 0) shuffleQueue.splice(qi, 1);
    }

    seekPreview = null;
    const media = setActiveMedia(track.type === 'video' ? 'video' : 'audio');
    const url = getURL(track);

    if (url && media.src !== url) {
      media.src = url;
      media.load();
    }

    if (prevTime > 0 && media !== prevMedia) {
      const restore = () => {
        media.removeEventListener('loadedmetadata', restore);
        try {
          const dur = media.duration;
          const t = isFinite(dur) && dur > 0
            ? Math.min(prevTime, Math.max(0, dur - 0.2))
            : prevTime;
          media.currentTime = t;
        } catch { /* 忽略 */ }
      };
      media.addEventListener('loadedmetadata', restore);
    }

    if (autoplay) {
      media.play().catch((err) => {
        if (err && err.name === 'AbortError') return;
        console.warn('[播放器] 播放失败：', err);
        updatePlayState();
      });
    }

    updateNowPlayingUI();
    highlightActive();
    updatePlayState();
    updateMediaSession();
    saveSettings();

    if (track.duration) durTimeEl.textContent = fmtTime(track.duration);
  }

  async function togglePlay() {
    if (!state.currentId) {
      const q = getQueue();
      if (q.length) playIndex(0);
      else toast('请先添加音乐文件');
      return;
    }

    const t = getCurrentTrack();
    if (t && !t.blob) {
      const blob = await ensureBlob(t);
      if (!blob) { toast('文件数据已丢失，请重新添加该文件'); return; }
    }

    ensureSrc();
    const media = getActiveMedia();
    if (media.paused) {
      media.play().catch((err) => {
        if (err && err.name === 'AbortError') return;
        toast('无法播放该文件');
      });
    } else {
      media.pause();
    }
  }

  function toggleMediaType() {
    const t = getCurrentTrack();
    if (!t || !t.pairedId) return;
    const pair = getTrackById(t.pairedId);
    if (!pair) return;
    playTrack(pair, true);
  }

  function buildShuffleQueue() {
    const q = getQueue();
    shuffleQueue = q.filter((t) => t.id !== state.currentId).map((t) => t.id);
    for (let i = shuffleQueue.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffleQueue[i], shuffleQueue[j]] = [shuffleQueue[j], shuffleQueue[i]];
    }
  }

  function nextIndex() {
    const q = getQueue();
    const n = q.length;
    if (n === 0) return -1;

    if (state.playMode === 'shuffle') {
      if (shuffleQueue.length === 0) {
        buildShuffleQueue();
        if (shuffleQueue.length === 0) return -1;
      }
      const id = shuffleQueue.shift();
      return q.findIndex((t) => t.id === id);
    }

    const ci = currentQueueIndex();
    if (state.playMode === 'order') {
      if (ci < 0) return 0;
      if (ci >= n - 1) return -1;
      return ci + 1;
    }
    if (ci < 0) return 0;
    return (ci + 1) % n;
  }

  function prevIndex() {
    const q = getQueue();
    const n = q.length;
    if (n === 0) return -1;

    if (state.playMode === 'shuffle') {
      while (playHistory.length) {
        const id = playHistory.pop();
        const idx = q.findIndex((t) => t.id === id);
        if (idx >= 0) return idx;
      }
      return -1;
    }
    const ci = currentQueueIndex();
    if (ci < 0) return 0;
    if (state.playMode === 'order') return Math.max(0, ci - 1);
    return (ci - 1 + n) % n;
  }

  function playNext() {
    const i = nextIndex();
    if (i >= 0) playIndex(i);
  }

  function playPrev() {
    const media = getActiveMedia();
    if (media.currentTime > 3) {
      media.currentTime = 0;
      updateProgress();
      updatePositionState(true);
      return;
    }
    const i = prevIndex();
    if (i >= 0 && i !== currentQueueIndex()) playIndex(i);
    else if (state.currentId) {
      media.currentTime = 0;
      updateProgress();
      updatePositionState(true);
    }
  }

  function onEnded() {
    if (!getQueue().length) return;
    if (state.playMode === 'one') {
      const media = getActiveMedia();
      if (!media.src) return;
      media.currentTime = 0;
      media.play().catch(() => {});
      return;
    }
    const i = nextIndex();
    if (i >= 0) playIndex(i);
    else {
      const media = getActiveMedia();
      media.currentTime = 0;
      updateProgress();
      updatePlayState();
    }
  }

  function cyclePlayMode() {
    const i = PLAY_MODES.indexOf(state.playMode);
    state.playMode = PLAY_MODES[(i + 1) % PLAY_MODES.length];
    updateModeButton();
    updateLoopButton();
    if (state.playMode === 'shuffle') buildShuffleQueue();
    else shuffleQueue = [];
    playHistory = [];
    toast(`播放模式：${MODE_LABELS[state.playMode]}`);
    saveSettings();
  }

  function toggleLoopPlay() {
    if (state.playMode === 'all' || state.playMode === 'one') {
      state.playMode = 'order';
      toast('循环播放：关');
    } else {
      state.playMode = 'all';
      toast('循环播放：开');
    }
    updateModeButton();
    updateLoopButton();
    shuffleQueue = [];
    playHistory = [];
    saveSettings();
  }

  /* =========================================================
   *  音量
   * ========================================================= */
  function setVolume(v, unmute = false, persist = true) {
    v = Math.min(1, Math.max(0, v));
    state.volume = v;
    if (unmute) state.muted = false;
    audio.volume = v;
    audio.muted = state.muted;
    videoEl.volume = v;
    videoEl.muted = state.muted;
    volFill.style.width = (v * 100) + '%';
    volBar.setAttribute('aria-valuenow', String(Math.round(v * 100)));
    volBar.setAttribute('aria-valuetext', `${Math.round(v * 100)}%`);
    updateVolumeIcon();
    if (persist) saveSettingsDebounced();
  }

  function toggleMute() {
    state.muted = !state.muted;
    audio.muted = state.muted;
    videoEl.muted = state.muted;
    updateVolumeIcon();
    saveSettings();
  }

  /* =========================================================
   *  歌单
   * ========================================================= */
  function switchPlaylist(id) {
    if (!state.playlists.find((p) => p.id === id)) return;
    if (selection.active) exitSelectMode();
    state.activePlaylistId = id;
    invalidateQueue();
    savePlaylists();
    updatePlPickerLabel();
    renderPlaylist(false);
    highlightActive();
    if (state.playMode === 'shuffle') buildShuffleQueue();
  }

  function toggleFromPlaylist(plId, trackId) {
    const pl = state.playlists.find((p) => p.id === plId);
    if (!pl || pl.builtin) return null;
    if (!Array.isArray(pl.trackIds)) pl.trackIds = [];
    const i = pl.trackIds.indexOf(trackId);
    let added;
    if (i >= 0) {
      pl.trackIds.splice(i, 1);
      added = false;
      toast(`已从“${pl.name}”移除`);
    } else {
      pl.trackIds.push(trackId);
      added = true;
      toast(`已加入“${pl.name}”`);
    }
    savePlaylists();
    invalidateQueue();
    if (state.activePlaylistId === plId) {
      renderPlaylist();
      highlightActive();
    }
    return added;
  }

  function removeFromPlaylist(plId, trackId) {
    const pl = state.playlists.find((p) => p.id === plId);
    if (!pl || pl.builtin || !Array.isArray(pl.trackIds)) return false;
    const i = pl.trackIds.indexOf(trackId);
    if (i < 0) return false;
    pl.trackIds.splice(i, 1);
    savePlaylists();
    invalidateQueue();
    if (state.activePlaylistId === plId) {
      renderPlaylist();
      highlightActive();
    }
    return true;
  }

  async function deleteTrack(id) {
    const track = getTrackById(id);
    if (!track) return;

    if (track.pairedId) {
      const pair = getTrackById(track.pairedId);
      if (pair) { pair.pairedId = null; dbPutMeta(pair); }
    }

    state.playlists.forEach((p) => {
      if (!p.builtin && Array.isArray(p.trackIds)) {
        const i = p.trackIds.indexOf(id);
        if (i >= 0) p.trackIds.splice(i, 1);
      }
    });
    savePlaylists();

    const idx = state.tracks.findIndex((t) => t.id === id);
    if (idx === -1) return;

    const wasCurrent = state.currentId === id;
    const wasPlaying = !getActiveMedia().paused;

    const oldQueue = getQueue().slice();
    const oldQueueIdx = oldQueue.findIndex((t) => t.id === id);

    if (wasCurrent) {
      getActiveMedia().pause();
      audio.removeAttribute('src');
      try { audio.load(); } catch { /* 忽略 */ }
      videoEl.removeAttribute('src');
      try { videoEl.load(); } catch { /* 忽略 */ }
    }

    state.tracks.splice(idx, 1);
    rebuildTrackIndex();
    invalidateQueue();
    releaseURL(track);
    track.blob = null;
    dbDelete(id);

    playHistory = [];
    shuffleQueue = [];

    if (selection.active) selection.ids.delete(id);

    if (wasCurrent) {
      state.currentId = null;
      const newQueue = getQueue();
      if (newQueue.length) {
        const nextIdx = Math.min(Math.max(0, oldQueueIdx), newQueue.length - 1);
        playIndex(nextIdx, wasPlaying);
      }
    }

    if (state.playMode === 'shuffle') buildShuffleQueue();

    renderPlaylist();
    updateNowPlayingUI();
    updatePlayState();
    updateSelectBar();
    saveSettings();
  }

  function createPlaylist(name) {
    name = String(name || '').trim().slice(0, 40);
    if (!name) return null;
    if (state.playlists.some((p) => p.name === name)) {
      toast('已存在同名歌单');
      return null;
    }
    const pl = { id: 'pl_' + uid(), name, trackIds: [] };
    state.playlists.push(pl);
    savePlaylists();
    invalidateQueue();
    return pl;
  }

  function renamePlaylist(id, name) {
    name = String(name || '').trim().slice(0, 40);
    if (!name) return false;
    const pl = state.playlists.find((p) => p.id === id);
    if (!pl || pl.builtin) return false;
    if (state.playlists.some((p) => p.id !== id && p.name === name)) {
      toast('已存在同名歌单');
      return false;
    }
    pl.name = name;
    savePlaylists();
    updatePlPickerLabel();
    return true;
  }

  function deletePlaylist(id) {
    const idx = state.playlists.findIndex((p) => p.id === id);
    if (idx < 0) return;
    const pl = state.playlists[idx];
    if (pl.builtin) return;
    if (!confirm(`确定删除歌单“${pl.name}”吗？歌曲本身不会被删除。`)) return;
    state.playlists.splice(idx, 1);
    savePlaylists();
    if (state.activePlaylistId === id) {
      state.activePlaylistId = 'all';
      invalidateQueue();
      savePlaylists();
      updatePlPickerLabel();
      renderPlaylist(false);
      highlightActive();
    }
    renderManageList();
    toast(`歌单“${pl.name}”已删除`);
  }

  async function clearCurrentList() {
    const pl = getActivePlaylist();
    if (pl.builtin) {
      if (!state.tracks.length) { toast('列表已经是空的了'); return; }
      if (!confirm('确定要清空整个音乐库吗？所有歌曲和MV文件将被删除。')) return;
      getActiveMedia().pause();
      audio.removeAttribute('src');
      try { audio.load(); } catch { /* 忽略 */ }
      videoEl.removeAttribute('src');
      try { videoEl.load(); } catch { /* 忽略 */ }
      state.tracks.forEach((t) => { releaseURL(t); t.blob = null; });
      state.tracks = [];
      rebuildTrackIndex();
      invalidateQueue();
      state.currentId = null;
      state.playlists.forEach((p) => { if (!p.builtin) p.trackIds = []; });
      savePlaylists();
      shuffleQueue = [];
      playHistory = [];
      if (selection.active) exitSelectMode();
      await dbClear();
      renderPlaylist(false);
      updateNowPlayingUI();
      updatePlayState();
      saveSettings();
      toast('音乐库已清空');
    } else {
      if (!pl.trackIds || !pl.trackIds.length) { toast('歌单已经是空的了'); return; }
      if (!confirm(`确定要清空歌单“${pl.name}”吗？歌曲本身不会被删除。`)) return;
      pl.trackIds = [];
      savePlaylists();
      invalidateQueue();
      renderPlaylist();
      highlightActive();
      toast(`歌单“${pl.name}”已清空`);
    }
  }

  /* =========================================================
   *  Media Session
   * ========================================================= */
  function updateMediaSession() {
    if (!('mediaSession' in navigator)) return;
    const t = getCurrentTrack();
    if (!t) {
      try { navigator.mediaSession.metadata = null; } catch { /* 忽略 */ }
      return;
    }
    const artwork = t.cover
      ? [{ src: t.cover, sizes: '256x256', type: dataUrlMime(t.cover) }]
      : [];
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: t.title,
        artist: t.artist,
        album: t.album || '离线音乐播放器',
        artwork
      });
    } catch { /* 忽略 */ }
  }

  let lastPosUpdate = 0;
  function updatePositionState(force = false) {
    if (!('mediaSession' in navigator) || !navigator.mediaSession.setPositionState) return;
    const now = performance.now();
    if (!force && now - lastPosUpdate < 900) return;
    lastPosUpdate = now;
    try {
      const media = getActiveMedia();
      const d = media.duration;
      if (!isFinite(d) || d <= 0) return;
      navigator.mediaSession.setPositionState({
        duration: d,
        playbackRate: media.playbackRate || 1,
        position: Math.min(Math.max(media.currentTime, 0), d)
      });
    } catch { /* 忽略 */ }
  }

  function setupMediaSession() {
    if (!('mediaSession' in navigator)) return;
    const safe = (action, handler) => {
      try { navigator.mediaSession.setActionHandler(action, handler); } catch { /* 忽略 */ }
    };
    safe('play',  () => { getActiveMedia().play().catch(() => {}); });
    safe('pause', () => getActiveMedia().pause());
    safe('previoustrack', playPrev);
    safe('nexttrack', playNext);
    safe('seekbackward', (d) => {
      const m = getActiveMedia();
      m.currentTime = Math.max(0, m.currentTime - (d.seekOffset || 10));
      updateProgress(); updatePositionState(true);
    });
    safe('seekforward', (d) => {
      const m = getActiveMedia();
      m.currentTime = Math.min(m.duration || 0, m.currentTime + (d.seekOffset || 10));
      updateProgress(); updatePositionState(true);
    });
    safe('seekto', (d) => {
      const m = getActiveMedia();
      if (d.seekTime != null && isFinite(d.seekTime)) {
        m.currentTime = d.seekTime;
        updateProgress(); updatePositionState(true);
      }
    });
    safe('stop', () => {
      const m = getActiveMedia();
      m.pause(); m.currentTime = 0;
    });
  }

  /* =========================================================
   *  拖动
   * ========================================================= */
  function makeDraggable(el, onMove, onCommit) {
    let active = false;
    let lastRatio = 0;
    const ratioOf = (e) => {
      const r = el.getBoundingClientRect();
      if (r.width === 0) return 0;
      return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    };
    const emit = (r) => { lastRatio = r; onMove(r); };

    el.addEventListener('pointerdown', (e) => {
      if (e.button !== undefined && e.button !== 0) return;
      active = true;
      el.classList.add('dragging');
      try { el.setPointerCapture(e.pointerId); } catch { /* 忽略 */ }
      emit(ratioOf(e));
      e.preventDefault();
    });
    el.addEventListener('pointermove', (e) => { if (active) emit(ratioOf(e)); });
    const end = () => {
      if (!active) return;
      active = false;
      el.classList.remove('dragging');
      if (onCommit) onCommit(lastRatio);
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('lostpointercapture', end);
  }

  /* =========================================================
   *  时长探测
   * ========================================================= */
  function getDuration(blob, type) {
    return new Promise((resolve) => {
      const url = URL.createObjectURL(blob);
      const el = type === 'video' ? document.createElement('video') : document.createElement('audio');
      let settled = false;
      let timer = null;
      const finish = (d) => {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        el.onloadedmetadata = null;
        el.onerror = null;
        el.removeAttribute('src');
        try { el.load(); } catch { /* 忽略 */ }
        URL.revokeObjectURL(url);
        resolve(isFinite(d) && d > 0 ? d : 0);
      };
      el.preload = 'metadata';
      el.onloadedmetadata = () => finish(el.duration);
      el.onerror = () => finish(0);
      timer = setTimeout(() => finish(0), 15000);
      el.src = url;
    });
  }

  const probeQueue = [];
  let probing = false;

  function enqueueProbe(track) {
    probeQueue.push(track);
    if (!probing) runProbeQueue();
  }

  async function runProbeQueue() {
    probing = true;
    while (probeQueue.length) {
      const batch = probeQueue.splice(0, 3);
      await Promise.all(batch.map(async (track) => {
        const blob = await ensureBlob(track);
        if (!blob) return;
        const dur = await getDuration(blob, track.type);
        if (dur > 0) {
          track.duration = dur;
          dbPutMeta(track);
          const el = findTrackEl(track.id);
          const durEl = el && el.querySelector('.track-dur');
          if (durEl) durEl.textContent = fmtTime(dur);
          if (state.currentId === track.id) durTimeEl.textContent = fmtTime(dur);
        }
      }));
    }
    probing = false;
  }

  /* =========================================================
   *  添加文件
   * ========================================================= */
  async function addFiles(fileList) {
    const all = Array.from(fileList || []);
    const files = all.filter((f) => isAudioFile(f) || isVideoFile(f));
    if (!files.length) { toast('没有找到支持的音视频文件'); return; }

    const existing = new Set(state.tracks.map((t) => `${t.name}::${t.size}`));
    const fresh = [];
    let skipped = 0;
    for (const f of files) {
      const key = `${f.name}::${f.size}`;
      if (existing.has(key)) { skipped++; continue; }
      existing.add(key);
      fresh.push(f);
    }
    if (!fresh.length) { toast('这些文件已在播放列表中'); return; }

    const space = await checkStorageForFiles(fresh);
    if (!space.ok) {
      const msg = `存储空间不足：本次需约 ${fmtBytes(space.needBytes)}，剩余约 ${fmtBytes(space.remainingBytes)}。请清理后重试。`;
      toast(msg);
      return;
    }

    if (fresh.length > 3) toast(`正在解析 ${fresh.length} 个文件…`);

    const tracks = await mapLimit(fresh, 4, async (file) => {
      const isVideo = isVideoFile(file);
      const info = (await readTags(file)) || {};
      let cover = info.cover || null;
      if (isVideo && !cover) cover = await extractVideoPoster(file);
      cover = await shrinkCover(cover);
      return {
        id: uid(),
        name: file.name,
        size: file.size,
        type: isVideo ? 'video' : 'audio',
        title: (info.title || cleanName(file.name)).slice(0, 200),
        artist: (info.artist || '未知艺术家').slice(0, 120),
        album: (info.album || '').slice(0, 120),
        cover,
        duration: 0,
        addedAt: Date.now(),
        pairedId: null,
        blob: file
      };
    });

    persistFailed = 0;
    tracks.forEach((t) => state.tracks.push(t));
    rebuildTrackIndex();
    invalidateQueue();

    const pairedExisting = [];
    tracks.forEach((t) => {
      if (t.pairedId) return;
      const pair = findPair(t, state.tracks);
      if (pair && !pair.pairedId) {
        t.pairedId = pair.id;
        pair.pairedId = t.id;
        if (!pair.title || pair.title === cleanName(pair.name)) pair.title = t.title;
        if (!pair.artist || pair.artist === '未知艺术家') pair.artist = t.artist;
        if (!pair.album) pair.album = t.album;
        if (!pair.cover && t.cover) pair.cover = t.cover;
        if (!pairedExisting.includes(pair)) pairedExisting.push(pair);
      }
    });

    await Promise.all(tracks.map((t) => dbPutFull(t)));
    if (pairedExisting.length) dbPutMetaBatch(pairedExisting);

    if (!state.currentId) {
      const q = getQueue();
      if (q.length) { state.currentId = q[0].id; ensureSrc(); }
    }

    tracks.forEach((t) => enqueueProbe(t));

    renderPlaylist();
    updateNowPlayingUI();
    highlightActive();
    if (selection.active) updateSelectBar();
    saveSettings();

    const added = tracks.length;
    const pairedCount = tracks.filter((t) => t.pairedId).length;
    if (persistFailed > 0) {
      toast(`已添加 ${added} 个，其中 ${persistFailed} 个未能保存（存储空间不足）。建议开启持久化存储。`);
    } else if (skipped) {
      toast(`已添加 ${added} 个（跳过 ${skipped} 个重复）`);
    } else if (pairedCount > 0) {
      toast(`已添加 ${added} 个（自动配对 ${pairedCount / 2 | 0} 组）`);
    } else {
      toast(`已添加 ${added} 个文件`);
    }
    persistFailed = 0;
  }

  /* =========================================================
   *  媒体事件
   * ========================================================= */
  function bindMediaEvents(el) {
    el.addEventListener('loadedmetadata', (e) => {
      if (e.target !== getActiveMedia()) return;
      const t = getCurrentTrack();
      if (t && isFinite(el.duration) && el.duration > 0 && !t.duration) {
        t.duration = el.duration;
        dbPutMeta(t);
        const node = findTrackEl(t.id);
        const durEl = node && node.querySelector('.track-dur');
        if (durEl) durEl.textContent = fmtTime(t.duration);
      }
      updateProgress();
      updatePositionState(true);
    });

    el.addEventListener('timeupdate', (e) => {
      if (e.target !== getActiveMedia()) return;
      if (el.paused) updateProgress();
      updatePositionState(false);
    });

    el.addEventListener('progress', (e) => {
      if (e.target !== getActiveMedia()) return;
      updateProgress();
    });

    el.addEventListener('play', (e) => {
      if (e.target !== getActiveMedia()) return;
      updatePlayState();
      cancelAnimationFrame(rafId);
      lastRafDraw = 0;
      rafId = requestAnimationFrame(rafLoop);
    });

    el.addEventListener('pause', (e) => {
      if (e.target !== getActiveMedia()) return;
      cancelAnimationFrame(rafId);
      rafId = null;
      updatePlayState();
      updateProgress();
    });

    el.addEventListener('ended', (e) => {
      if (e.target !== getActiveMedia()) return;
      onEnded();
    });

    el.addEventListener('error', (e) => {
      if (e.target !== getActiveMedia()) return;
      if (!el.src) return;
      const code = el.error && el.error.code;
      const msgs = {
        1: '播放已中止',
        2: '网络错误，无法加载媒体',
        3: '解码失败，格式可能不受支持',
        4: '格式不受支持或文件已损坏'
      };
      toast(msgs[code] || '媒体加载失败');
    });
  }

  /* =========================================================
   *  事件绑定
   * ========================================================= */
  function bindEvents() {
    bindMediaEvents(audio);
    bindMediaEvents(videoEl);

    videoEl.addEventListener('dblclick', () => {
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      } else if (videoEl.requestFullscreen) {
        videoEl.requestFullscreen().catch(() => {});
      }
    });

    playBtn.addEventListener('click', togglePlay);
    prevBtn.addEventListener('click', playPrev);
    nextBtn.addEventListener('click', playNext);
    modeBtn.addEventListener('click', cyclePlayMode);
    mediaTypeBtn.addEventListener('click', toggleMediaType);
    muteBtn.addEventListener('click', toggleMute);
    loopBtn.addEventListener('click', toggleLoopPlay);

    sleepBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!popupEl.hidden) { closePopup(); return; }
      showSleepMenu();
    });

    tabbarEl.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-go]');
      if (!btn) return;
      const idx = Number(btn.dataset.go);
      if (idx === currentPage) return;
      goToPage(idx, idx > currentPage ? 1 : -1);
    });

    let swipeX = 0, swipeY = 0, swipeOn = false;

    stageEl.addEventListener('touchstart', (e) => {
      if (isDesktop()) { swipeOn = false; return; }
      if (e.touches.length !== 1) { swipeOn = false; return; }
      const t = e.target;
      if (t.closest && t.closest('[role="slider"], .bar, input, textarea, select')) {
        swipeOn = false;
        return;
      }
      swipeX = e.touches[0].clientX;
      swipeY = e.touches[0].clientY;
      swipeOn = true;
    }, { passive: true });

    stageEl.addEventListener('touchend', (e) => {
      if (!swipeOn) return;
      swipeOn = false;
      const t = e.changedTouches[0];
      if (!t) return;
      const dx = t.clientX - swipeX;
      const dy = t.clientY - swipeY;
      const adx = Math.abs(dx), ady = Math.abs(dy);
      if (adx > 62 && adx > ady * 1.3) {
        if (dx < 0) goToPage(currentPage + 1, 1);
        else goToPage(currentPage - 1, -1);
      }
    }, { passive: true });

    selectBtn.addEventListener('click', () => {
      if (selection.active) exitSelectMode();
      else enterSelectMode(null);
    });
    selCancelBtn.addEventListener('click', exitSelectMode);
    selAllBtn.addEventListener('click', toggleSelectAll);
    selAddBtn.addEventListener('click', showAddToPlaylistSheet);
    selNewBtn.addEventListener('click', () => {
      const ids = Array.from(selection.ids);
      if (!ids.length) { toast('请先选择歌曲'); return; }
      openCreatePlaylistModal(ids);
    });

    playlistEl.addEventListener('pointerdown', (e) => {
      if (selection.active) return;
      if (e.button !== undefined && e.button !== 0) return;
      const item = e.target.closest('.track');
      if (!item || e.target.closest('.track-more')) return;

      lpOrigin = { x: e.clientX, y: e.clientY, id: item.dataset.id };
      clearTimeout(lpTimer);
      lpTimer = setTimeout(() => {
        if (!lpOrigin) return;
        const id = lpOrigin.id;
        lpOrigin = null;
        suppressClick = true;
        setTimeout(() => { suppressClick = false; }, 500);
        try { if (navigator.vibrate) navigator.vibrate(12); } catch { /* 忽略 */ }
        enterSelectMode(id);
      }, 460);
    });

    playlistEl.addEventListener('pointermove', (e) => {
      if (!lpOrigin) return;
      if (Math.hypot(e.clientX - lpOrigin.x, e.clientY - lpOrigin.y) > 10) {
        clearTimeout(lpTimer);
        lpOrigin = null;
      }
    });

    ['pointerup', 'pointercancel', 'pointerleave'].forEach((type) => {
      playlistEl.addEventListener(type, () => {
        clearTimeout(lpTimer);
        lpOrigin = null;
      });
    });

    makeDraggable(
      seekBar,
      (r) => {
        seekPreview = r;
        seekFill.style.width = (r * 100) + '%';
        seekBar.setAttribute('aria-valuenow', String(Math.round(r * 100)));
        const media = getActiveMedia();
        const d = media.duration;
        curTimeEl.textContent = fmtTime(r * (isFinite(d) && d > 0 ? d : 0));
      },
      (r) => {
        const media = getActiveMedia();
        const d = media.duration;
        if (isFinite(d) && d > 0) media.currentTime = Math.min(d, r * d);
        seekPreview = null;
        updateProgress();
        updatePositionState(true);
      }
    );

    makeDraggable(
      volBar,
      (r) => setVolume(r, true, false),
      (r) => setVolume(r, true, true)
    );

    seekBar.addEventListener('keydown', (e) => {
      const media = getActiveMedia();
      const d = media.duration;
      if (!isFinite(d) || d <= 0) return;
      let t = media.currentTime;
      if (e.code === 'ArrowRight') t = Math.min(d, t + (e.shiftKey ? 10 : 5));
      else if (e.code === 'ArrowLeft') t = Math.max(0, t - (e.shiftKey ? 10 : 5));
      else if (e.code === 'Home') t = 0;
      else if (e.code === 'End') t = d;
      else return;
      e.preventDefault(); e.stopPropagation();
      media.currentTime = t;
      updateProgress();
      updatePositionState(true);
    });

    volBar.addEventListener('keydown', (e) => {
      let v = state.volume;
      if (e.code === 'ArrowRight' || e.code === 'ArrowUp') v = Math.min(1, v + 0.05);
      else if (e.code === 'ArrowLeft' || e.code === 'ArrowDown') v = Math.max(0, v - 0.05);
      else if (e.code === 'Home') v = 0;
      else if (e.code === 'End') v = 1;
      else return;
      e.preventDefault(); e.stopPropagation();
      setVolume(v, true);
      toast(`音量 ${Math.round(v * 100)}%`);
    });

    playlistEl.addEventListener('click', (e) => {
      if (suppressClick) { suppressClick = false; return; }

      const moreBtn = e.target.closest('.track-more');
      if (moreBtn) {
        e.stopPropagation();
        showTrackMenu(moreBtn, moreBtn.dataset.more);
        return;
      }
      const item = e.target.closest('.track');
      if (!item) return;
      const id = item.dataset.id;

      if (selection.active) {
        toggleSelect(id);
        return;
      }

      if (id === state.currentId) {
        if (isDesktop()) togglePlay();
        else goToPage(1, 1);
        return;
      }

      playById(id);
      if (!isDesktop()) goToPage(1, 1);
    });

    addBtn.addEventListener('click', () => fileInput.click());
    clearBtn.addEventListener('click', clearCurrentList);

    plPicker.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!popupEl.hidden) { closePopup(); return; }
      showPickerMenu();
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files && fileInput.files.length) addFiles(fileInput.files);
      fileInput.value = '';
    });

    manageClose.addEventListener('click', closeManageModal);
    manageModal.addEventListener('click', (e) => {
      if (e.target === manageModal) closeManageModal();
    });

    newPlaylistBtn.addEventListener('click', () => {
      openCreatePlaylistModal([]);
    });

    manageListEl.addEventListener('input', (e) => {
      const input = e.target.closest('.manage-input');
      if (!input) return;
      const id = input.dataset.id;
      const name = input.value.trim();
      const dup = !!name && state.playlists.some((p) => p.id !== id && p.name === name);
      input.style.borderColor = dup ? 'var(--danger)' : '';
      input.title = dup ? '已存在同名歌单' : '';
    });

    manageListEl.addEventListener('change', (e) => {
      const input = e.target.closest('.manage-input');
      if (!input) return;
      const id = input.dataset.id;
      const pl = state.playlists.find((p) => p.id === id);
      if (!pl) return;
      const newName = input.value.trim().slice(0, 40);
      if (!newName) { input.value = pl.name; input.style.borderColor = ''; return; }
      if (renamePlaylist(id, newName)) {
        input.value = pl.name;
        input.style.borderColor = '';
        updatePlPickerLabel();
      } else {
        input.value = pl.name;
        input.style.borderColor = '';
      }
    });

    manageListEl.addEventListener('click', (e) => {
      const delBtn = e.target.closest('[data-del-pl]');
      if (delBtn) deletePlaylist(delBtn.dataset.delPl);
    });

    createPlClose.addEventListener('click', closeCreatePlaylistModal);
    createPlCancel.addEventListener('click', closeCreatePlaylistModal);
    createPlModal.addEventListener('click', (e) => {
      if (e.target === createPlModal) closeCreatePlaylistModal();
    });
    createPlName.addEventListener('input', updateCreateModalState);
    createPlName.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !createPlOk.disabled) {
        e.preventDefault();
        submitCreatePlaylist();
      }
    });
    createPlOk.addEventListener('click', submitCreatePlaylist);

    sheetBackdrop.addEventListener('click', closePopup);

    let dragDepth = 0;
    let dropTimer = null;
    const hideDrop = () => {
      dragDepth = 0;
      dropOverlay.classList.remove('show');
      clearTimeout(dropTimer);
    };
    const showDrop = () => {
      dropOverlay.classList.add('show');
      clearTimeout(dropTimer);
      dropTimer = setTimeout(hideDrop, 5000);
    };

    window.addEventListener('dragenter', (e) => {
      if (!e.dataTransfer) return;
      if (!Array.from(e.dataTransfer.types || []).includes('Files')) return;
      e.preventDefault();
      dragDepth++;
      showDrop();
    });
    window.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
      if (dropOverlay.classList.contains('show')) {
        clearTimeout(dropTimer);
        dropTimer = setTimeout(hideDrop, 5000);
      }
    });
    window.addEventListener('dragleave', (e) => {
      e.preventDefault();
      dragDepth = Math.max(0, dragDepth - 1);
      if (dragDepth === 0) hideDrop();
    });
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      hideDrop();
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
        addFiles(e.dataTransfer.files);
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Escape' || e.key === 'Escape') {
        if (!createPlModal.hidden) { closeCreatePlaylistModal(); return; }
        if (!popupEl.hidden) { closePopup(); return; }
        if (!manageModal.hidden) { closeManageModal(); return; }
        if (selection.active) { exitSelectMode(); return; }
        if (!isDesktop() && currentPage !== 0) { goToPage(0, -1); return; }
        hideDrop();
        return;
      }

      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;

      if (selection.active) {
        if (e.code === 'KeyA') { e.preventDefault(); toggleSelectAll(); return; }
        if (e.code === 'Enter' && selection.ids.size) {
          e.preventDefault();
          showAddToPlaylistSheet();
          return;
        }
      }

      const onInteractive = e.target.closest &&
        e.target.closest('button, [role="slider"], a, [tabindex]');
      if (onInteractive && (e.code === 'Space' || e.code === 'Enter')) return;

      const media = getActiveMedia();
      switch (e.code) {
        case 'Space':
          e.preventDefault(); togglePlay(); break;
        case 'ArrowRight':
          e.preventDefault();
          if (e.shiftKey) playNext();
          else if (isFinite(media.duration)) {
            media.currentTime = Math.min(media.duration, media.currentTime + 5);
            updateProgress(); updatePositionState(true);
          }
          break;
        case 'ArrowLeft':
          e.preventDefault();
          if (e.shiftKey) playPrev();
          else if (isFinite(media.duration)) {
            media.currentTime = Math.max(0, media.currentTime - 5);
            updateProgress(); updatePositionState(true);
          }
          break;
        case 'ArrowUp':
          e.preventDefault();
          setVolume(state.volume + 0.05, true);
          toast(`音量 ${Math.round(state.volume * 100)}%`);
          break;
        case 'ArrowDown':
          e.preventDefault();
          setVolume(state.volume - 0.05, true);
          toast(`音量 ${Math.round(state.volume * 100)}%`);
          break;
        case 'KeyM': toggleMute(); break;
        case 'KeyR': cyclePlayMode(); break;
        case 'KeyL': toggleLoopPlay(); break;
        case 'KeyV': toggleMediaType(); break;
        case 'KeyN': playNext(); break;
        case 'KeyP': playPrev(); break;
        default: break;
      }
    });

    setupMediaSession();

    let lastDesktop = isDesktop();
    window.addEventListener('resize', () => {
      const now = isDesktop();
      if (now !== lastDesktop) {
        lastDesktop = now;
        pageEls.forEach((p) => {
          const t = pageHideTimers.get(p);
          if (t) { clearTimeout(t); pageHideTimers.delete(p); }
        });
        applyPageVisibility();
        syncTab();
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        const media = getActiveMedia();
        if (!media.paused) {
          cancelAnimationFrame(rafId);
          lastRafDraw = 0;
          rafId = requestAnimationFrame(rafLoop);
        }
      }
    });
  }

  /* =========================================================
   *  启动
   * ========================================================= */
  async function boot() {
    setupViewportVar();

    await ensurePersistentStorage();

    coverFallback.innerHTML = NOTE_SVG;
    loadPlaylists();
    updatePlPickerLabel();
    updateModeButton();
    updateLoopButton();
    renderPlaylist();
    updateNowPlayingUI();
    updateVolumeIcon();

    const saved = loadSettings();

    let initTheme = 0;
    if (saved && typeof saved.themeIndex === 'number' &&
        saved.themeIndex >= 0 && saved.themeIndex < THEMES.length) {
      initTheme = saved.themeIndex;
    }
    applyTheme(initTheme);

    if (saved) {
      if (PLAY_MODES.includes(saved.playMode)) state.playMode = saved.playMode;
      state.volume = typeof saved.volume === 'number'
        ? Math.min(1, Math.max(0, saved.volume)) : 1;
      state.muted = !!saved.muted;
      updateModeButton();
      updateLoopButton();
      state.currentId = saved.currentId || null;
    }

    setVolume(state.volume, false, false);
    updateVolumeIcon();

    await initDB();

    const stored = await dbGetAllMeta();

    if (stored.length) {
      stored.sort((a, b) => (a.addedAt || 0) - (b.addedAt || 0));
      stored.forEach((t) => {
        t._url = null;
        t.blob = null;
        if (!t.type) t.type = 'audio';
        if (!t.pairedId) t.pairedId = null;
      });
      state.tracks = stored;
      rebuildTrackIndex();
      invalidateQueue();

      repairPairs();

      if (!state.currentId || !getTrackById(state.currentId)) {
        state.currentId = getQueue()[0]?.id || state.tracks[0]?.id || null;
      }

      state.playlists.forEach((p) => {
        if (!p.builtin && Array.isArray(p.trackIds)) {
          p.trackIds = p.trackIds.filter((id) => !!getTrackById(id));
        }
      });
      savePlaylists();
      invalidateQueue();

      renderPlaylist();
      updateNowPlayingUI();
    }

    if (state.playMode === 'shuffle') buildShuffleQueue();

    currentPage = state.tracks.length ? 1 : 0;
    applyPageVisibility();
    syncTab();

    bindEvents();
    updateProgress();
    applyTrackVisual();
  }

  boot().catch((err) => {
    console.error('[播放器] 初始化失败：', err);
    toast('初始化异常，但基础播放功能仍可用');
    try { bindEvents(); } catch { /* 忽略 */ }
  });
})();
</script>
