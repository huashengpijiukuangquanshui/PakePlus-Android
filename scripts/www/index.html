<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>纸艺贪吃蛇</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    /* 牛皮纸背景 */
    background-color: #d4c5a9;
    background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 2px, transparent 2px, transparent 4px);
    font-family: 'Comic Sans MS', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    user-select: none;
    overflow: hidden;
  }

  .game-container {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px;
  }

  /* 顶部计分板 */
  .hud {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    padding: 10px 16px;
    background: #fdfaf2;
    border-radius: 12px;
    box-shadow: 2px 4px 8px rgba(0,0,0,0.15), inset -2px -2px 5px rgba(0,0,0,0.05);
    color: #556b2f;
    font-weight: bold;
  }
  .hud span { font-size: 16px; }
  .hud b { font-size: 22px; color: #e8b976; text-shadow: 1px 1px 0px #b8860b; }

  /* 游戏画布容器 - 使用 padding 撑开正方形以兼容所有手机 */
  .canvas-wrapper {
    position: relative;
    width: 100%;
    height: 0;
    padding-bottom: 100%; /* 保证正方形 */
    border-radius: 16px;
    background: #b9d79a;
    box-shadow: 4px 6px 12px rgba(0,0,0,0.2), inset 0 0 20px rgba(0,0,0,0.05);
    border: 6px solid #fdfaf2;
    overflow: hidden;
  }

  canvas {
    position: absolute;
    top: 0; left: 0;
    display: block;
    width: 100%;
    height: 100%;
  }

  /* 状态遮罩 */
  .overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(253, 250, 242, 0.9); /* 去掉可能导致不兼容的滤镜 */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    z-index: 10; /* 确保在最上层 */
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .overlay h2 { color: #556b2f; font-size: 26px; margin-bottom: 8px; }
  .overlay p { color: #7a8b5c; font-size: 15px; margin-bottom: 20px; }
  
  .btn {
    background: #a8c98a;
    color: #fff;
    border: none;
    padding: 12px 32px;
    border-radius: 30px;
    font-size: 18px;
    font-weight: bold;
    box-shadow: 0 4px 0 #83a865, 0 6px 10px rgba(0,0,0,0.2);
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .btn:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 #83a865, 0 2px 5px rgba(0,0,0,0.2);
  }

  /* 底部虚拟方向键 */
  .controls {
    margin-top: 16px;
    display: grid;
    grid-template-columns: repeat(3, 54px);
    grid-template-rows: repeat(3, 54px);
    gap: 8px;
    opacity: 0.9;
  }
  .d-pad {
    background: #fdfaf2;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: #83a865;
    box-shadow: 2px 4px 6px rgba(0,0,0,0.15);
    cursor: pointer;
  }
  .d-pad:active {
    background: #e8f2db;
    transform: translateY(2px);
    box-shadow: 1px 2px 3px rgba(0,0,0,0.15);
  }
  .up { grid-column: 2; grid-row: 1; }
  .left { grid-column: 1; grid-row: 2; }
  .right { grid-column: 3; grid-row: 2; }
  .down { grid-column: 2; grid-row: 3; }

  /* 隐藏 PC 端的提示 */
  @media (hover: hover) and (pointer: fine) {
    .controls { display: none; }
  }
</style>
</head>
<body>

<div class="game-container">
  <div class="hud">
    <span>纸艺贪吃蛇</span>
    <span>分数 <b id="score">0</b></span>
  </div>

  <div class="canvas-wrapper" id="canvasWrapper">
    <canvas id="game"></canvas>
    <div class="overlay show" id="overlay">
      <h2 id="overlayTitle">准备开始</h2>
      <p id="overlayDesc">滑动屏幕或使用方向键移动</p>
      <button class="btn" id="startBtn">开始游戏</button>
    </div>
  </div>

  <div class="controls">
    <div class="d-pad up" data-dir="up">▲</div>
    <div class="d-pad left" data-dir="left">◀</div>
    <div class="d-pad right" data-dir="right">▶</div>
    <div class="d-pad down" data-dir="down">▼</div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ================= 配置区 =================
  const COLS = 16; 
  const ROWS = 16;
  const STEP_MS = 160; 
  
  const COLORS = {
    bg: '#b9d79a',
    trackLine: 'rgba(255, 255, 255, 0.4)',
    snakeHead: '#9ec27d',
    snakeBody: ['#a8c98a', '#d8df8d', '#e8b976'],
    eyeWhite: '#ffffff',
    eyeBlack: '#1f2937',
    blush: 'rgba(255, 150, 150, 0.6)',
    tongue: '#f87171',
    star: '#fcd34d',
    starShadow: '#d97706'
  };

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayDesc = document.getElementById('overlayDesc');
  const startBtn = document.getElementById('startBtn');
  const canvasWrapper = document.getElementById('canvasWrapper');

  let cellSize = 20; 

  let snake, dir, nextDir, food, score, state, acc, lastTime;

  // ================= 兼容性辅助函数 =================
  // 手写圆角矩形，替代不兼容的 ctx.roundRect()
  function drawRoundRect(c, x, y, w, h, r) {
    if (w < 2 * r) r = w / 2;
    if (h < 2 * r) r = h / 2;
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  // ================= 初始化与缩放 =================
  function resizeCanvas() {
    const rect = canvasWrapper.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    
    // 减去边框宽度计算实际内宽
    cellSize = (rect.width - 12) / COLS;
    
    if (snake) draw();
  }

  window.addEventListener('resize', resizeCanvas);

  // ================= 游戏逻辑 =================
  function initGame() {
    snake = [
      { x: 7, y: 8 },
      { x: 6, y: 8 },
      { x: 5, y: 8 }
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    scoreEl.textContent = '0';
    acc = 0;
    lastTime = performance.now();
    placeFood();
    state = 'ready'; // 初始准备状态
    draw(); // 立即画出蛇和食物
  }

  function placeFood() {
    const free = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
      }
    }
    if (free.length) {
      food = free[Math.floor(Math.random() * free.length)];
      food.phase = Math.random() * Math.PI * 2;
    } else {
      food = null;
    }
  }

  function step() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver();
    if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();

    snake.unshift(head);

    if (food && head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      placeFood();
    } else {
      snake.pop();
    }
  }

  function gameOver() {
    state = 'over';
    showOverlay('游戏结束', `最终得分：${score}`);
  }

  function showOverlay(title, desc) {
    overlayTitle.textContent = title;
    overlayDesc.textContent = desc;
    startBtn.textContent = state === 'over' ? '再来一局' : '开始游戏';
    overlay.classList.add('show');
  }

  function hideOverlay() {
    overlay.classList.remove('show');
  }

  // ================= 纸艺风格绘制 =================
  function drawStar(cx, cy, spikes, outerRadius, innerRadius) {
    let rot = Math.PI / 2 * 3;
    const step = Math.PI / spikes;

    ctx.beginPath();
    ctx.moveTo(cx, cy - outerRadius);
    for (let i = 0; i < spikes; i++) {
      ctx.lineTo(cx + Math.cos(rot) * outerRadius, cy + Math.sin(rot) * outerRadius);
      rot += step;
      ctx.lineTo(cx + Math.cos(rot) * innerRadius, cy + Math.sin(rot) * innerRadius);
      rot += step;
    }
    ctx.lineTo(cx, cy - outerRadius);
    ctx.closePath();
  }

  function drawSnakeSegment(x, y, index) {
    const gap = cellSize * 0.1;
    const size = cellSize - gap * 2;
    const px = x * cellSize + gap + 6; // 加 6 补偿 canvas 边框
    const py = y * cellSize + gap + 6;

    // 纸张底色
    if (index === 0) {
      ctx.fillStyle = COLORS.snakeHead;
    } else {
      ctx.fillStyle = COLORS.snakeBody[(index - 1) % COLORS.snakeBody.length];
    }

    // 使用手写兼容方法绘制
    drawRoundRect(ctx, px, py, size, size, cellSize * 0.15);
    ctx.fill();

    // 纸张高光
    ctx.lineWidth = cellSize * 0.05;
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.stroke();

    // 蛇头细节
    if (index === 0) {
      const eyeSize = size * 0.25;
      const eyeY = py + size * 0.3;
      let eyeLeftX = px + size * 0.25;
      let eyeRightX = px + size * 0.75;
      
      if (dir.x === -1) { eyeLeftX = px + size * 0.1; eyeRightX = px + size * 0.4; } 
      else if (dir.x === 1) { eyeLeftX = px + size * 0.6; eyeRightX = px + size * 0.9; }

      ctx.fillStyle = COLORS.eyeWhite;
      ctx.beginPath(); ctx.arc(eyeLeftX, eyeY, eyeSize, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(eyeRightX, eyeY, eyeSize, 0, Math.PI*2); ctx.fill();
      
      ctx.fillStyle = COLORS.eyeBlack;
      ctx.beginPath(); ctx.arc(eyeLeftX + dir.x*2, eyeY + dir.y*2, eyeSize*0.5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(eyeRightX + dir.x*2, eyeY + dir.y*2, eyeSize*0.5, 0, Math.PI*2); ctx.fill();

      ctx.fillStyle = COLORS.blush;
      ctx.beginPath(); ctx.arc(px + size*0.2, py + size*0.7, eyeSize*0.6, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(px + size*0.8, py + size*0.7, eyeSize*0.6, 0, Math.PI*2); ctx.fill();

      // 吐信子（动态）
      if (dir.x === 1 && Math.sin(Date.now()/200) > 0) {
        ctx.strokeStyle = COLORS.tongue;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(px + size, py + size/2);
        ctx.lineTo(px + size + 8, py + size/2 - 4);
        ctx.lineTo(px + size + 12, py + size/2 - 2);
        ctx.moveTo(px + size + 8, py + size/2 - 4);
        ctx.lineTo(px + size + 12, py + size/2 - 6);
        ctx.stroke();
      }
    }
  }

  function draw() {
    if (!snake) return;

    // 1. 背景
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 2. 跑道线
    ctx.strokeStyle = COLORS.trackLine;
    ctx.lineWidth = cellSize * 0.3;
    ctx.lineCap = 'round';
    
    const w = canvas.width / (window.devicePixelRatio || 1);
    const h = canvas.height / (window.devicePixelRatio || 1);

    drawRoundRect(ctx, cellSize*0.5 + 6, cellSize*0.5 + 6, w - cellSize - 12, h - cellSize - 12, cellSize*2);
    ctx.stroke();

    drawRoundRect(ctx, cellSize*2 + 6, cellSize*2 + 6, w - cellSize*4 - 12, h - cellSize*4 - 12, cellSize*1.5);
    ctx.stroke();

    // 3. 食物 (折纸星星)
    if (food) {
      const float = Math.sin(Date.now() / 300 + food.phase) * 2;
      const cx = food.x * cellSize + cellSize / 2 + 6;
      const cy = food.y * cellSize + cellSize / 2 + 6 + float;
      
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      drawStar(cx + 2, cy + 2, 5, cellSize * 0.4, cellSize * 0.2);
      ctx.fill();

      ctx.fillStyle = COLORS.star;
      drawStar(cx, cy, 5, cellSize * 0.4, cellSize * 0.2);
      ctx.fill();
      
      ctx.strokeStyle = COLORS.starShadow;
      ctx.lineWidth = 1;
      ctx.stroke();
      
      ctx.beginPath();
      ctx.moveTo(cx, cy - cellSize*0.2);
      ctx.lineTo(cx, cy + cellSize*0.2);
      ctx.stroke();
    }

    // 4. 蛇身
    for (let i = snake.length - 1; i >= 0; i--) {
      drawSnakeSegment(snake[i].x, snake[i].y, i);
    }
  }

  // ================= 主循环 =================
  function loop(now) {
    const dt = Math.min(now - lastTime, 100);
    lastTime = now;

    if (state === 'running') {
      acc += dt;
      if (acc >= STEP_MS) {
        acc -= STEP_MS;
        step();
      }
    }

    draw();
    requestAnimationFrame(loop);
  }

  // ================= 控制 =================
  function setDir(x, y) {
    if (state !== 'running') return;
    if (dir.x === -x && dir.y === -y) return;
    nextDir = { x, y };
  }

  window.addEventListener('keydown', e => {
    switch(e.key) {
      case 'ArrowUp': case 'w': case 'W': setDir(0, -1); break;
      case 'ArrowDown': case 's': case 'S': setDir(0, 1); break;
      case 'ArrowLeft': case 'a': case 'A': setDir(-1, 0); break;
      case 'ArrowRight': case 'd': case 'D': setDir(1, 0); break;
    }
  });

  let touchStartX = 0, touchStartY = 0;
  canvas.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  canvas.addEventListener('touchend', e => {
    if (state !== 'running') return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) < 30 && Math.abs(dy) < 30) return;
    if (Math.abs(dx) > Math.abs(dy)) setDir(dx > 0 ? 1 : -1, 0);
    else setDir(0, dy > 0 ? 1 : -1);
  }, { passive: true });

  document.querySelectorAll('.d-pad').forEach(btn => {
    const handler = (e) => {
      e.preventDefault();
      const dirStr = e.currentTarget.getAttribute('data-dir');
      if (dirStr === 'up') setDir(0, -1);
      if (dirStr === 'down') setDir(0, 1);
      if (dirStr === 'left') setDir(-1, 0);
      if (dirStr === 'right') setDir(1, 0);
    };
    btn.addEventListener('touchstart', handler, { passive: false });
    btn.addEventListener('mousedown', handler);
  });

  startBtn.addEventListener('click', () => {
    if (state === 'over' || state === 'ready') {
      if (state === 'over') initGame(); // 如果已结束，彻底重置
      state = 'running';
      hideOverlay();
      lastTime = performance.now(); // 防止时间跳跃
      acc = 0;
    }
  });

  // ================= 启动 =================
  // 确保 DOM 渲染完毕后再获取尺寸，避免获取到 0
  setTimeout(() => {
    resizeCanvas();
    initGame(); // 自动生成蛇和食物，一打开就能看到
    requestAnimationFrame(loop);
  }, 50);

})();
</script>
</body>
</html>
