<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#04080c">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>离线音乐播放器</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #04080c;
    --panel: #0b1218;
    --panel-2: #101a22;
    --line: #1b2a30;
    --line-soft: #142128;
    --text: #eef6f4;
    --dim: #6f8490;
    --accent: #2dd4bf;
    --accent-2: #22d3ee;
    --accent-deep: #0d9488;
    --accent-light: #7df0dd;
    --tint-1: 45, 212, 191;
    --tint-2: 34, 211, 238;
    --water-a: 4, 9, 13;
    --water-b: 6, 16, 21;
    --danger: #f43f5e;
    --radius: 24px;
    --radius-sm: 16px;
    --ease: cubic-bezier(.4, 0, .2, 1);
    --vvh: 100dvh;

    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
  }

  html, body { height: 100%; }

  html {
    -webkit-text-size-adjust: 100%;
    touch-action: manipulation;
  }

  body {
    background:
      radial-gradient(1200px 700px at 8% -18%, rgba(var(--tint-1), .16), transparent 60%),
      radial-gradient(1000px 620px at 96% 116%, rgba(var(--tint-2), .13), transparent 62%),
      radial-gradient(800px 600px at 50% 50%, rgba(var(--tint-1), .05), transparent 70%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    transition: background-color 1s var(--ease);
  }

  input, textarea {
    user-select: text;
    -webkit-user-select: text;
    -webkit-touch-callout: default;
  }

  button:focus-visible,
  [role="slider"]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .app {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 380px;
    gap: 18px;
    width: min(1120px, 100%);
    height: 100%;
    max-height: 760px;
  }

  .stage {
    display: contents;
  }

  .page {
    position: relative;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 30px 80px -46px rgba(0, 0, 0, .92);
  }

  .page[data-page="0"] { grid-column: 2; grid-row: 1; }
  .page[data-page="1"] { grid-column: 1; grid-row: 1; }

  .tabbar { display: none; }

  /* ============ 播放页 ============ */
  .player {
    align-items: center;
    padding: 28px 30px 22px;
    background: #050d12;
    box-shadow:
      0 30px 80px -40px rgba(0, 0, 0, .9),
      inset 0 1px 0 rgba(255, 255, 255, .03);
  }

  .player-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    border-radius: inherit;
    pointer-events: none;
    isolation: isolate;
  }

  .water-base {
    position: absolute;
    inset: 0;
    z-index: 0;
    background: linear-gradient(180deg,
      rgb(var(--water-a)) 0%,
      rgb(var(--water-b)) 40%,
      rgb(var(--water-b)) 100%);
    transition: background 1s var(--ease);
  }

  .bg-cover {
    position: absolute;
    inset: -14%;
    z-index: 1;
    background-position: center;
    background-size: cover;
    filter: blur(64px) saturate(.55) brightness(.48);
    transform: scale(1.16) translateZ(0);
    -webkit-transform: scale(1.16) translateZ(0);
    opacity: 0;
    transition: opacity 1.1s var(--ease);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .player.has-cover .bg-cover { opacity: .18; }

  .galaxy-layer {
    position: absolute;
    inset: -10%;
    z-index: 2;
    filter: blur(30px) saturate(1.3);
    opacity: .85;
    pointer-events: none;
    transform: translateZ(0);
    -webkit-transform: translateZ(0);
    transition: opacity 1.5s var(--ease);
    mix-blend-mode: screen;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }

  .galaxy-0 {
    background:
      radial-gradient(circle at 25% 35%, rgba(var(--tint-1), 0.45) 0%, transparent 40%),
      radial-gradient(circle at 75% 65%, rgba(var(--tint-2), 0.45) 0%, transparent 45%),
      radial-gradient(circle at 50% 50%, rgba(var(--tint-1), 0.2) 0%, transparent 70%);
    animation: galaxySpin 45s linear infinite;
  }
  .galaxy-1 {
    background:
      conic-gradient(from 0deg at 50% 50%, transparent 0deg, rgba(var(--tint-1), 0.3) 60deg, transparent 120deg, rgba(var(--tint-2), 0.3) 240deg, transparent 300deg);
    animation: galaxySpin 60s linear infinite reverse;
  }
  .galaxy-2 {
    background:
      radial-gradient(ellipse at 10% 20%, rgba(var(--tint-2), 0.5) 0%, transparent 50%),
      radial-gradient(ellipse at 90% 80%, rgba(var(--tint-1), 0.5) 0%, transparent 50%);
    animation: galaxyDrift 35s ease-in-out infinite alternate;
  }
  .galaxy-3 {
    background:
      radial-gradient(circle at 50% 50%, rgba(var(--tint-1), 0.5) 0%, transparent 25%),
      radial-gradient(circle at 50% 50%, rgba(var(--tint-2), 0.2) 0%, transparent 60%),
      radial-gradient(circle at 20% 80%, rgba(var(--tint-1), 0.3) 0%, transparent 40%);
    animation: galaxyPulse 20s ease-in-out infinite;
  }
  .galaxy-4 {
    background:
      linear-gradient(45deg, transparent 20%, rgba(var(--tint-1), 0.3) 40%, transparent 60%),
      linear-gradient(-45deg, transparent 20%, rgba(var(--tint-2), 0.3) 40%, transparent 60%);
    animation: galaxyDrift 40s ease-in-out infinite alternate-reverse;
  }
  .galaxy-5 {
    background:
      radial-gradient(circle at 80% 20%, rgba(var(--tint-1), 0.45) 0%, transparent 30%),
      radial-gradient(circle at 20% 80%, rgba(var(--tint-2), 0.45) 0%, transparent 30%),
      radial-gradient(circle at 50% 50%, rgba(var(--tint-1), 0.15) 0%, transparent 60%);
    animation: galaxySpin 80s linear infinite;
  }
  .galaxy-6 {
    background:
      repeating-radial-gradient(circle at 50% 50%, transparent 0, transparent 20px, rgba(var(--tint-1), 0.15) 25px, transparent 30px);
    animation: galaxyPulse 25s ease-in-out infinite alternate;
  }
  .galaxy-7 {
    background:
      radial-gradient(circle at 10% 90%, rgba(var(--tint-2), 0.6) 0%, transparent 35%),
      radial-gradient(circle at 90% 10%, rgba(var(--tint-1), 0.6) 0%, transparent 35%),
      conic-gradient(from 90deg at 50% 50%, transparent, rgba(var(--tint-2), 0.2) 180deg, transparent);
    animation: galaxySpin 50s linear infinite reverse;
  }
  .galaxy-8 {
    background:
      radial-gradient(circle at 50% 30%, rgba(var(--tint-1), 0.4) 0%, transparent 40%),
      radial-gradient(circle at 50% 70%, rgba(var(--tint-2), 0.4) 0%, transparent 40%),
      radial-gradient(circle at 50% 50%, rgba(var(--tint-1), 0.1) 0%, transparent 70%);
    animation: galaxyDrift 30s ease-in-out infinite alternate;
  }

  @keyframes galaxySpin {
    from { transform: rotate(0deg) scale(1) translateZ(0); }
    to   { transform: rotate(360deg) scale(1.1) translateZ(0); }
  }
  @keyframes galaxyDrift {
    0%   { transform: translate(-2%, -2%) scale(1) translateZ(0); }
    100% { transform: translate(2%, 2%) scale(1.05) translateZ(0); }
  }
  @keyframes galaxyPulse {
    0%, 100% { opacity: 0.6; transform: scale(0.98) translateZ(0); }
    50%      { opacity: 1; transform: scale(1.05) translateZ(0); }
  }

  .starfield {
    position: absolute;
    inset: 0;
    z-index: 2;
    background-image:
      radial-gradient(1px 1px at 10% 10%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 30% 70%, rgba(255,255,255,0.8), transparent),
      radial-gradient(1px 1px at 80% 20%, #fff, transparent),
      radial-gradient(2px 2px at 60% 80%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 90% 60%, #fff, transparent);
    background-size: 250px 250px;
    opacity: 0.25;
    animation: starTwinkle 8s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes starTwinkle {
    0% { opacity: 0.15; }
    100% { opacity: 0.4; }
  }

  .water-tint {
    position: absolute;
    inset: 0;
    z-index: 3;
    background:
      radial-gradient(75% 55% at 50% 100%, rgba(var(--tint-1), .25), transparent 72%),
      radial-gradient(65% 45% at 50% -5%, rgba(var(--tint-2), .12), transparent 70%);
    mix-blend-mode: screen;
    pointer-events: none;
    transition: background 1s var(--ease);
  }

  /* ==========================================================
   * 波光动画（Android WebView 优化版）
   * 关键：移除 will-change: transform（WebView 会锁定图层尺寸），
   * 改用 -webkit-transform: translateZ(0) 强制合成层。
   * ========================================================== */
  .wave-layer {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 200%;
    z-index: 4;
    pointer-events: none;
    transform: translateZ(0);
    -webkit-transform: translateZ(0);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    -webkit-animation-fill-mode: both;
    animation-fill-mode: both;
  }
  .wave-layer.wave-1 {
    height: 34%;
    opacity: .20;
    -webkit-animation: waveScroll 17s linear infinite;
    animation: waveScroll 17s linear infinite;
  }
  .wave-layer.wave-2 {
    height: 44%;
    opacity: .24;
    -webkit-animation: waveScroll 26s linear infinite reverse;
    animation: waveScroll 26s linear infinite reverse;
  }
  .wave-layer.wave-3 {
    height: 56%;
    opacity: .18;
    -webkit-animation: waveScroll 38s linear infinite;
    animation: waveScroll 38s linear infinite;
  }

  .wave-svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .wave-layer.wave-1 .wave-svg path { fill: var(--accent); transition: fill 1s var(--ease); }
  .wave-layer.wave-2 .wave-svg path { fill: var(--accent-2); transition: fill 1s var(--ease); }
  .wave-layer.wave-3 .wave-svg path { fill: var(--accent-deep); transition: fill 1s var(--ease); }

  @-webkit-keyframes waveScroll {
    from { -webkit-transform: translate3d(0, 0, 0); }
    to   { -webkit-transform: translate3d(-50%, 0, 0); }
  }
  @keyframes waveScroll {
    from { transform: translate3d(0, 0, 0); }
    to   { transform: translate3d(-50%, 0, 0); }
  }

  /* WebView 专属覆盖：进一步强制合成层 */
  .is-webview .wave-layer {
    -webkit-transform: translateZ(0.01px);
    transform: translateZ(0.01px);
    will-change: auto;
  }

  .glow-orb {
    position: absolute;
    left: 50%;
    bottom: -18%;
    width: 130%;
    aspect-ratio: 1.7;
    transform: translateX(-50%) translateZ(0);
    -webkit-transform: translateX(-50%) translateZ(0);
    z-index: 5;
    background: radial-gradient(
      ellipse at center,
      rgba(var(--tint-1), .35),
      transparent 62%
    );
    filter: blur(46px);
    opacity: .55;
    pointer-events: none;
    will-change: opacity, transform;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .player.is-playing .glow-orb {
    animation: glowPulse 2.6s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%, 100% { opacity: .42; transform: translateX(-50%) scale(.94) translateZ(0); }
    50%      { opacity: .85; transform: translateX(-50%) scale(1.06) translateZ(0); }
  }

  .bg-veil {
    position: absolute;
    inset: 0;
    z-index: 6;
    background:
      radial-gradient(125% 90% at 50% 0%, rgba(4, 9, 13, .1), rgba(4, 9, 13, .55) 68%, rgba(4, 9, 13, .8) 100%),
      linear-gradient(180deg, transparent 0%, rgba(4, 9, 13, .25) 62%, rgba(4, 9, 13, .5) 100%);
    pointer-events: none;
  }

  .player > :not(.player-bg) {
    position: relative;
    z-index: 1;
  }

  .cover-wrap {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 0 18px;
  }

  .cover-wrap::before {
    content: "";
    position: absolute;
    inset: 18% 22%;
    background: radial-gradient(circle, rgba(var(--tint-1), .9) 0%, transparent 68%);
    filter: blur(48px);
    opacity: .22;
    transition: opacity .6s var(--ease);
    pointer-events: none;
    z-index: 0;
    transform: translateZ(0);
    -webkit-transform: translateZ(0);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .player.is-playing .cover-wrap::before {
    opacity: .42;
    animation: breathe 5.5s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: .3; transform: scale(1) translateZ(0); }
    50%      { opacity: .58; transform: scale(1.06) translateZ(0); }
  }

  .cover {
    position: relative;
    z-index: 1;
    aspect-ratio: 1 / 1;
    height: 100%;
    max-height: 320px;
    max-width: 100%;
    border-radius: 18px;
    overflow: hidden;
    display: grid;
    place-items: center;
    background: linear-gradient(145deg, #1b2a30, #0d161b);
    border: 1px solid rgba(255, 255, 255, .07);
    box-shadow:
      0 30px 70px -24px rgba(0, 0, 0, .95),
      0 0 0 1px rgba(var(--tint-1), .15),
      inset 0 1px 0 rgba(255, 255, 255, .05);
    transition: box-shadow 1s var(--ease);
  }

  .cover::after {
    content: "";
    position: absolute;
    inset: -22%;
    background:
      radial-gradient(circle at 30% 26%, rgba(var(--tint-1), .18), transparent 32%),
      radial-gradient(circle at 72% 74%, rgba(var(--tint-2), .12), transparent 36%);
    opacity: 0;
    transition: opacity .8s var(--ease);
    mix-blend-mode: screen;
    pointer-events: none;
    z-index: 2;
    transform: translateZ(0);
    -webkit-transform: translateZ(0);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .player.is-playing .cover::after {
    opacity: 1;
    animation: coverShimmer 7s ease-in-out infinite alternate;
  }
  @keyframes coverShimmer {
    0%   { transform: scale(1) rotate(0deg) translateZ(0); opacity: .55; }
    100% { transform: scale(1.14) rotate(9deg) translateZ(0); opacity: 1; }
  }

  .cover-fallback {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    width: 100%;
    height: 100%;
  }
  .cover-fallback img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .cover-fallback svg { width: 32%; height: 32%; opacity: .18; }

  .cover video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    display: none;
    cursor: zoom-in;
  }
  .cover.is-video video { display: block; }
  .cover.is-video .cover-fallback { display: none; }
  .cover.is-video { background: #000; }
  .cover.is-video::after { display: none; }
  .cover video:fullscreen { cursor: default; object-fit: contain; }

  .info {
    width: 100%;
    text-align: center;
    margin-bottom: 18px;
    flex: none;
  }
  .title {
    font-size: 20px;
    font-weight: 650;
    letter-spacing: -.012em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-shadow: 0 1px 12px rgba(4, 9, 13, .6);
  }
  .artist {
    margin-top: 7px;
    font-size: 13px;
    color: var(--dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: .005em;
  }

  .timeline { width: 100%; margin-bottom: 12px; flex: none; }

  .bar {
    position: relative;
    height: 16px;
    display: flex;
    align-items: center;
    cursor: pointer;
    touch-action: none;
  }
  .bar::before {
    content: "";
    position: absolute;
    left: 0; right: 0;
    height: 4px;
    border-radius: 2px;
    background: rgba(255, 255, 255, .08);
    transition: height .16s var(--ease);
  }
  .bar-buffer, .bar-fill {
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    height: 4px;
    border-radius: 2px;
    transition: height .16s var(--ease), width .08s linear, background 1s var(--ease);
    pointer-events: none;
    overflow: hidden;
  }
  .bar-buffer { background: rgba(var(--tint-1), .18); width: 0; }
  .bar-fill {
    background: linear-gradient(90deg, var(--accent-deep), var(--accent) 50%, var(--accent-2));
    width: 0;
    box-shadow: 0 0 12px rgba(var(--tint-1), .5);
  }
  .bar-fill::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
      90deg,
      transparent 0%,
      rgba(255, 255, 255, .38) 50%,
      transparent 100%
    );
    background-size: 220% 100%;
    border-radius: inherit;
    opacity: 0;
    transition: opacity .3s var(--ease);
  }
  .player.is-playing .bar-fill::after {
    opacity: 1;
    animation: shimmer 2.8s linear infinite;
  }
  @keyframes shimmer {
    from { background-position: -100% 0; }
    to   { background-position: 200% 0; }
  }

  .bar:hover::before,
  .bar:hover .bar-buffer,
  .bar:hover .bar-fill,
  .bar.dragging::before,
  .bar.dragging .bar-buffer,
  .bar.dragging .bar-fill { height: 6px; }

  .knob {
    position: absolute;
    right: -6px;
    top: 50%;
    transform: translateY(-50%);
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
    box-shadow:
      0 2px 10px rgba(0, 0, 0, .65),
      0 0 0 4px rgba(var(--tint-1), .3),
      0 0 16px rgba(var(--tint-1), .65);
    opacity: 0;
    transition: opacity .16s var(--ease), box-shadow 1s var(--ease);
    pointer-events: none;
  }
  .bar:hover .knob, .bar.dragging .knob { opacity: 1; }

  .time-row {
    display: flex;
    justify-content: space-between;
    margin-top: 3px;
    font-size: 11.5px;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
    letter-spacing: .02em;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    flex: none;
    flex-wrap: wrap;
    justify-content: center;
  }

  .ctrl {
    position: relative;
    width: 44px;
    height: 44px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--dim);
    cursor: pointer;
    transition: color .16s, background .16s, transform .1s var(--ease);
    -webkit-tap-highlight-color: transparent;
  }
  .ctrl:hover  { color: var(--text); background: rgba(var(--tint-1), .1); }
  .ctrl:active { transform: scale(.93); }
  .ctrl svg { width: 20px; height: 20px; }

  .mode-btn .i-mode { display: none; }
  .mode-btn[data-mode="order"]   .i-order   { display: block; }
  .mode-btn[data-mode="all"]     .i-all     { display: block; }
  .mode-btn[data-mode="one"]     .i-one     { display: block; }
  .mode-btn[data-mode="shuffle"] .i-shuffle { display: block; }

  .mode-btn[data-mode="all"],
  .mode-btn[data-mode="one"],
  .mode-btn[data-mode="shuffle"] { color: var(--accent); }
  .mode-btn[data-mode="all"]:hover,
  .mode-btn[data-mode="one"]:hover,
  .mode-btn[data-mode="shuffle"]:hover { color: var(--accent-light); }

  .mode-btn[data-mode="one"]::after {
    content: "1";
    position: absolute;
    right: 6px;
    bottom: 6px;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: var(--accent);
    color: #041014;
    font-size: 9px;
    font-weight: 800;
    line-height: 13px;
    text-align: center;
  }

  .media-type-btn {
    width: auto;
    padding: 0 15px;
    height: 34px;
    gap: 6px;
    border-radius: 999px;
    background: rgba(var(--tint-1), .14);
    color: var(--accent-light);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .02em;
    transition: background .3s var(--ease), color .3s var(--ease), transform .1s var(--ease);
  }
  .media-type-btn:hover {
    background: rgba(var(--tint-1), .26);
    color: #e0fffa;
  }
  .media-type-btn svg { width: 14px; height: 14px; }
  .media-type-btn[hidden] { display: none !important; }
  .media-type-btn .i-mv { display: block; }
  .media-type-btn .i-audio { display: none; }
  .media-type-btn[data-direction="to-audio"] .i-mv { display: none; }
  .media-type-btn[data-direction="to-audio"] .i-audio { display: block; }

  .play {
    width: 64px;
    height: 64px;
    color: #041014;

      0 14px 32px -10px rgba(var(--tint-1), .9),
      0 0 0 1px rgba(var(--tint-1), .3),
      inset 0 1px 0 rgba(255, 255, 255, .35);
    transition: transform .12s var(--ease), box-shadow .5s var(--ease), filter .2s var(--ease), background 1s var(--ease);
    transform: translateZ(0);
    -webkit-transform: translateZ(0);
  }

  /* ==========================================================
   * 播放按钮脉动光圈（Android WebView 优化版）
   * 关键：
   * 1) 用 cubic-bezier 替代 linear（WebView 对 linear 跳帧）
   * 2) translateZ(0) 强制 GPU 合成层
   * 3) -webkit-animation-fill-mode: both 保留首尾帧
   * 4) 显式 transform-origin 保证缩放基准点正确
   * ========================================================== */
  .play::before {
    content: "";
    position: absolute;
    left: -5px;
    top: -5px;
    right: -5px;
    bottom: -5px;
    border-radius: 50%;
    border: 1px solid rgba(var(--tint-1), .45);
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s var(--ease);
    transform: scale(1) translateZ(0);
    -webkit-transform: scale(1) translateZ(0);
    transform-origin: 50% 50%;
    -webkit-transform-origin: 50% 50%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    -webkit-animation-fill-mode: both;
    animation-fill-mode: both;
  }
  .play.playing::before {
    opacity: 1;
    will-change: transform, opacity;
    -webkit-animation: playRing 2.2s cubic-bezier(.25, .46, .45, .94) infinite;
    animation: playRing 2.2s cubic-bezier(.25, .46, .45, .94) infinite;
  }
  @-webkit-keyframes playRing {
    0%   { -webkit-transform: scale(1) translateZ(0);    opacity: .65; }
    100% { -webkit-transform: scale(1.55) translateZ(0); opacity: 0; }
  }
  @keyframes playRing {
    0%   { transform: scale(1) translateZ(0);    opacity: .65; }
    100% { transform: scale(1.55) translateZ(0); opacity: 0; }
  }

  .play:hover {
    transform: scale(1.05) translateZ(0);
    -webkit-transform: scale(1.05) translateZ(0);
    filter: brightness(1.1) saturate(1.05);
  }
  .play:active { transform: scale(.97) translateZ(0); }
  .play svg { width: 26px; height: 26px; }

  .play.playing .i-play  { display: none; }
  .play.playing .i-pause { display: block; }

    margin-top: 10px;
    min-height: 18px;
    font-size: 12px;
    line-height: 1.6;
    color: var(--dim);
  }
  .create-hint.error { color: var(--danger); }

  .create-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  .btn-ghost, .btn-solid {
    flex: 1;
    height: 46px;
    border-radius: 13px;
    font: inherit;
    font-size: 14px;
    font-weight: 650;
    cursor: pointer;
    border: 1px solid var(--line);
    transition: .16s var(--ease);
    -webkit-tap-highlight-color: transparent;
  }
  .btn-ghost:active, .btn-solid:active { transform: scale(.97); }
  .btn-ghost {
    background: transparent;
    color: var(--text);
  }
  .btn-ghost:hover { background: rgba(255, 255, 255, .05); }
  .btn-solid {
    background: linear-gradient(145deg, var(--accent-light), var(--accent) 60%, var(--accent-deep));
    color: #041014;
    border-color: transparent;
    box-shadow: 0 10px 26px -12px rgba(var(--tint-1), .95);
  }
  .btn-solid:disabled {
    opacity: .35;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
  }

  .drop-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    background: rgba(4, 9, 13, .85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    opacity: 0;
    visibility: hidden;
    transition: opacity .2s var(--ease), visibility .2s;
    pointer-events: none;
  }
  .drop-overlay.show { opacity: 1; visibility: visible; }

  .drop-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 56px 72px;
    border: 2px dashed rgba(var(--tint-1), .55);
    border-radius: 24px;
    background: rgba(var(--tint-1), .06);
    color: var(--accent-light);
    font-size: 15px;
    font-weight: 550;
  }
  .drop-inner svg { width: 46px; height: 46px; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(34px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 16px);
    padding: 11px 22px;
    border-radius: 18px;
    background: rgba(14, 24, 30, .96);
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 13px;
    line-height: 1.5;
    box-shadow: 0 12px 34px rgba(0, 0, 0, .65), 0 0 0 1px rgba(var(--tint-1), .08);
    opacity: 0;
    visibility: hidden;
    transition: .25s var(--ease);
    z-index: 500;
    pointer-events: none;
    max-width: calc(100vw - 40px);
    text-align: center;
  }
  .toast.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); }

  /* ============ 移动端 ============ */
  @media (max-width: 880px) {
    body { padding: 0; display: block; }

    .app {
      display: flex;
      flex-direction: column;
      gap: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      max-height: none;
    }

    .stage {
      display: block;
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }

    .page {
      position: absolute;
      inset: 0;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      visibility: hidden;
      opacity: 0;
      transform: translateX(0);
      will-change: transform, opacity;
      transition: none;
    }
    .page[data-page="0"] { visibility: visible; opacity: 1; }

    .tabbar {
      display: flex;
      position: relative;
      flex: 0 0 auto;
      z-index: 40;
      padding-left: var(--sal);
      padding-right: var(--sar);
      padding-bottom: var(--sab);
      background: rgba(9, 14, 19, .84);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      backdrop-filter: blur(22px) saturate(180%);
      border-top: 1px solid rgba(120, 160, 200, .13);
      box-shadow: 0 -10px 30px rgba(0, 0, 0, .5);
    }
    .tabbar button {
      flex: 1 1 0;
      min-width: 0;
      height: 54px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      background: none;
      border: 0;
      padding: 0;
      color: var(--dim);
      font: inherit;
      font-size: 10px;
      letter-spacing: .3px;
      cursor: pointer;
      position: relative;
      transition: color .2s var(--ease);
      -webkit-tap-highlight-color: transparent;
    }
    .tabbar button svg {
      width: 22px;
      height: 22px;
      opacity: .78;
      transition: transform .22s var(--ease), opacity .22s var(--ease);
    }
    .tabbar button.on { color: var(--accent); }
    .tabbar button.on svg { opacity: 1; transform: translateY(-1.5px) scale(1.06); }
    .tabbar button.on::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 24px;
      height: 2.5px;
      border-radius: 99px;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }
    .tabbar .tab-dot {
      position: absolute;
      top: 11px;
      left: 50%;
      margin-left: 7px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 7px var(--accent);
      animation: tabDotPulse 1.7s ease-in-out infinite;
    }
    .tabbar .tab-dot[hidden] { display: none; }
    @keyframes tabDotPulse {
      0%, 100% { opacity: .5; transform: scale(.8); }
      50%      { opacity: 1; transform: scale(1.15); }
    }

    .player {
      align-items: center;
      padding: calc(var(--sat) + 10px) 18px 10px;
      background: #050d12;
      box-shadow: none;
    }
    .player-bg { border-radius: 0; }

    .cover-wrap { flex: 1 1 auto; min-height: 0; padding: 4px 0 10px; }

    .cover {
      height: auto;
      width: min(64vw, 300px, calc(var(--vvh, 100vh) * 0.36));
      aspect-ratio: 1 / 1;
      max-height: none;
      max-width: 100%;
      border-radius: 16px;
    }

    .info { margin-bottom: 12px; }
    .title { font-size: 17px; }
    .artist { font-size: 12px; margin-top: 5px; }

    .timeline { margin-bottom: 10px; }
    .controls { gap: 8px; margin-bottom: 10px; }
    .play { width: 60px; height: 60px; }
    .play svg { width: 24px; height: 24px; }
    .media-type-btn { height: 32px; font-size: 11px; padding: 0 13px; }
    .bottom-row { gap: 8px; }
    .vol-bar { width: min(120px, 26vw); }

    .pane-list {
      background: linear-gradient(180deg, rgba(13, 20, 26, .96) 0%, rgba(8, 14, 18, .99) 100%);
    }
    .pane-list .pl-header {
      padding: calc(var(--sat) + 14px) 16px 12px;
    }
    .track { min-height: 62px; }

    .sel-actionbar {
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    }

    .modal-overlay { align-items: flex-end; padding: 0; }
    .modal {
      width: 100%;
      max-width: none;
      max-height: 88dvh;
      border-radius: 20px 20px 0 0;
      border-left: 0;
      border-right: 0;
      border-bottom: 0;
      animation: sheetUp .24s var(--ease);
    }
    .modal-header::before {
      content: "";
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background: var(--line);
    }
    .modal-header { padding-top: 20px; }
    .modal.create-pl .modal-body { padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }

    .toast { bottom: calc(76px + var(--sab)); }
  }

  @media (max-width: 380px) {
    .ctrl { width: 42px; height: 42px; }
    .play { width: 56px; height: 56px; }
    .play svg { width: 22px; height: 22px; }
    .media-type-btn { padding: 0 10px; font-size: 10.5px; }
    .title { font-size: 15.5px; }
    .vol-bar { width: 86px; }
    .loop-btn { width: 34px; height: 34px; }
    .loop-btn svg { width: 15px; height: 15px; }
    .sleep-btn { padding: 0 10px 0 8px; font-size: 11px; height: 34px; }
    .sleep-btn svg { width: 14px; height: 14px; }
    .sel-action { font-size: 13px; height: 42px; }
  }

  @media (max-height: 660px) and (max-width: 880px) {
    .player { padding-top: calc(var(--sat) + 6px); }
    .cover { width: min(52vw, 240px, calc(var(--vvh, 100vh) * 0.30)); }
    .info { margin-bottom: 9px; }
    .title { font-size: 15.5px; }
    .timeline { margin-bottom: 8px; }
    .controls { margin-bottom: 8px; }
    .play { width: 54px; height: 54px; }
  }

  /* ==========================================================
   * ★★★ Android WebView 关键修复 ★★★
   * 原规则 `animation: none !important` + `animation-duration: .01ms`
   * 会导致波光、脉动在 PakePlus/WebView 中完全停止。
   * 现仅降级 transition，不动 animation。
   * ========================================================== */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>

<div class="app">
  <main class="stage" id="stage">

    <!-- ================= 首页：歌单 ================= -->
    <section class="page pane-list" data-page="0" aria-label="歌单">
      <header class="pl-header" id="plHeader">
        <div class="pl-title-wrap">
          <button class="pl-picker" id="plPicker" aria-expanded="false" aria-haspopup="menu">
            <span id="plPickerName">全部歌曲</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="m6 9 6 6 6-6"/>
            </svg>
          </button>
          <div class="count" id="plCount">0 首</div>
        </div>
        <div class="pl-actions">
          <button class="icon-btn" id="selectBtn" title="多选歌曲" aria-label="多选歌曲">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 11l3 3L22 4"/>
              <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
            </svg>
          </button>
          <button class="icon-btn" id="addBtn" title="添加音乐/视频" aria-label="添加音乐/视频">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 5v14"/><path d="M5 12h14"/>
            </svg>
          </button>
          <button class="icon-btn danger" id="clearBtn" title="清空列表" aria-label="清空列表">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6h18"/><path d="M8 6V4h8v2"/>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
              <path d="M10 11v6"/><path d="M14 11v6"/>
            </svg>
          </button>
        </div>
      </header>

      <div class="pl-select-header" id="plSelectHeader" hidden>
        <button class="sel-btn" id="selCancelBtn" type="button">取消</button>
        <div class="sel-count" id="selCount">已选 <b>0</b> 首</div>
        <button class="sel-btn" id="selAllBtn" type="button">全选</button>
      </div>

      <ul class="playlist" id="playlist"></ul>

      <div class="empty" id="emptyState">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="8" cy="18" r="3"/>
          <path d="M11 18V5l10-2v13"/>
          <circle cx="18" cy="16" r="3"/>
        </svg>
        <p id="emptyTitle">播放列表空空如也</p>
        <span id="emptyHint">把音频/视频文件拖到窗口任意位置<br>或点击右上角 + 添加</span>
      </div>

      <div class="sel-actionbar" id="selActionBar" hidden>
        <button class="sel-action ghost" id="selAddBtn" type="button" disabled>加入歌单</button>
        <button class="sel-action primary" id="selNewBtn" type="button" disabled>新建歌单</button>
      </div>
    </section>

    <!-- ================= 播放页 ================= -->
    <section class="page player" id="player" data-page="1" aria-label="播放">
      <div class="player-bg" id="playerBg" aria-hidden="true">
        <div class="water-base"></div>
        <div class="bg-cover"></div>
        <div class="galaxy-layer galaxy-0" id="galaxyLayer"></div>
        <div class="starfield"></div>
        <div class="water-tint"></div>

        <div class="wave-layer wave-1" aria-hidden="true">
          <svg class="wave-svg" viewBox="0 0 1200 200" preserveAspectRatio="none">
            <path d="M0,100 q 75,-40 150,0 q 75,40 150,0 q 75,-40 150,0 q 75,40 150,0
                     q 75,-40 150,0 q 75,40 150,0 q 75,-40 150,0 q 75,40 150,0
                     L1200,200 L0,200 Z"/>
          </svg>
        </div>
        <div class="wave-layer wave-2" aria-hidden="true">
          <svg class="wave-svg" viewBox="0 0 1200 200" preserveAspectRatio="none">
            <path d="M0,110 q 90,-50 180,0 q 90,50 180,0 q 90,-50 180,0 q 90,50 180,0
                     q 90,-50 180,0 q 90,50 180,0
                     L1200,200 L0,200 Z"/>
          </svg>
        </div>
        <div class="wave-layer wave-3" aria-hidden="true">
          <svg class="wave-svg" viewBox="0 0 1200 200" preserveAspectRatio="none">
            <path d="M0,120 q 110,-60 220,0 q 110,60 220,0 q 110,-60 220,0
                     q 110,60 220,0 q 110,-60 220,0
                     L1200,200 L0,200 Z"/>
          </svg>
        </div>

        <div class="glow-orb"></div>
        <div class="bg-veil"></div>
      </div>

      <div class="cover-wrap">
        <div class="cover" id="cover">
          <video id="videoEl" playsinline webkit-playsinline x-webkit-airplay="allow" preload="metadata"></video>
          <div class="cover-fallback" id="coverFallback"></div>
        </div>
      </div>

      <div class="info">
        <h1 class="title" id="title">还没有音乐</h1>
        <p class="artist" id="artist">拖入音频/视频文件或点击 + 添加</p>
      </div>

      <div class="timeline">
        <div class="bar" id="seekBar" role="slider" tabindex="0"
             aria-label="播放进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="bar-buffer" id="bufFill"></div>
          <div class="bar-fill" id="seekFill"><span class="knob"></span></div>
        </div>
        <div class="time-row">
          <span id="curTime">0:00</span>
          <span id="durTime">0:00</span>
        </div>
      </div>

      <div class="controls">
        <button class="ctrl mode-btn" id="modeBtn" data-mode="order"
                title="播放模式 (R)" aria-label="播放模式：顺序播放">
          <svg class="i-mode i-order" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 6h13"/><path d="M4 12h10"/><path d="M4 18h13"/>
            <path d="m16 9 3 3-3 3"/>
          </svg>
          <svg class="i-mode i-all" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 2l4 4-4 4"/>
            <path d="M3 11v-1a4 4 0 0 1 4-4h14"/>
            <path d="M7 22l-4-4 4-4"/>
            <path d="M21 13v1a4 4 0 0 1-4 4H3"/>
          </svg>
          <svg class="i-mode i-one" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 2l4 4-4 4"/>
            <path d="M3 11v-1a4 4 0 0 1 4-4h14"/>
            <path d="M7 22l-4-4 4-4"/>
            <path d="M21 13v1a4 4 0 0 1-4 4H3"/>
          </svg>
          <svg class="i-mode i-shuffle" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 3h5v5"/><path d="M4 20 21 3"/>
            <path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="m4 4 5 5"/>
          </svg>
        </button>

        <button class="ctrl" id="prevBtn" title="上一首" aria-label="上一首">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 20 9 12l10-8z"/><path d="M5 19V5"/>
          </svg>
        </button>

        <button class="ctrl play" id="playBtn" title="播放 / 暂停 (空格)" aria-label="播放">
          <svg class="i-play" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5.14v13.72a1 1 0 0 0 1.53.85l10.9-6.86a1 1 0 0 0 0-1.7L9.53 4.29A1 1 0 0 0 8 5.14z"/>
          </svg>
          <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor">
            <rect x="6" y="4.5" width="4" height="15" rx="1.5"/>
            <rect x="14" y="4.5" width="4" height="15" rx="1.5"/>
          </svg>
        </button>

        <button class="ctrl" id="nextBtn" title="下一首" aria-label="下一首">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 4l10 8-10 8z"/><path d="M19 5v14"/>
          </svg>
        </button>

        <button class="ctrl media-type-btn" id="mediaTypeBtn" hidden
                title="切换MV" aria-label="切换MV">
          <svg class="i-mv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="6" width="14" height="12" rx="2"/>
            <path d="m16 10 6-3v10l-6-3"/>
          </svg>
          <svg class="i-audio" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="8" cy="18" r="3"/><path d="M11 18V5l10-2v13"/><circle cx="18" cy="16" r="3"/>
          </svg>
          <span class="media-type-label">看MV</span>
        </button>
      </div>

      <div class="bottom-row">
        <button class="ctrl" id="muteBtn" title="静音 (M)" aria-label="静音">
          <svg class="i-vol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 5 6 9H2v6h4l5 4z"/>
            <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
            <path d="M18.5 5.5a9 9 0 0 1 0 13"/>
          </svg>
          <svg class="i-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <path d="M11 5 6 9H2v6h4l5 4z"/>
            <path d="m23 9-6 6"/><path d="m17 9 6 6"/>
          </svg>
        </button>

        <div class="bar vol-bar" id="volBar" role="slider" tabindex="0"
             aria-label="音量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
          <div class="bar-fill" id="volFill"><span class="knob"></span></div>
        </div>

        <button class="ctrl loop-btn" id="loopBtn" title="循环播放：关 (L)" aria-label="循环播放：关" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 2l4 4-4 4"/>
            <path d="M3 11v-1a4 4 0 0 1 4-4h14"/>
            <path d="M7 22l-4-4 4-4"/>
            <path d="M21 13v1a4 4 0 0 1-4 4H3"/>
          </svg>
        </button>

        <button class="sleep-btn" id="sleepBtn" title="睡眠定时器" aria-label="睡眠定时器">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <span class="sleep-label">定时</span>
          <span class="sleep-time" id="sleepTime"></span>
        </button>
      </div>
    </section>
  </main>

  <nav class="tabbar" id="tabbar" role="tablist" aria-label="主导航">
    <button data-go="0" role="tab" aria-selected="true" aria-label="首页">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="16" rx="3"/>
        <path d="M7 9.5h10M7 13.5h10M7 17.5h6"/>
      </svg>
      <span>首页</span>
    </button>
    <button data-go="1" role="tab" aria-selected="false" aria-label="播放">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="7.5" cy="17.5" r="2.6"/>
        <path d="M10.1 17.5V6.2l9.2-2.2v11.3"/>
        <circle cx="16.7" cy="15.3" r="2.6"/>
      </svg>
      <span>播放</span>
      <i class="tab-dot" id="tabDot" hidden></i>
    </button>
  </nav>
</div>

<div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
<div class="popup-menu" id="popupMenu" hidden role="menu"></div>

<div class="modal-overlay" id="manageModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="manageTitle">
    <header class="modal-header">

<script>
(() => {
  'use strict';

  /* =========================================================
   *  WebView 检测（PakePlus / Android WebView）
   *  在最早时机给 <html> 加类名，启用专属样式覆盖
   * ========================================================= */
  const IS_WEBVIEW = /wv\)|PakePlus|; wv\)|Version\/.*Chrome.*Mobile.*Safari/i.test(navigator.userAgent) && /wv\)|PakePlus/.test(navigator.userAgent);
  if (IS_WEBVIEW) {
    document.documentElement.classList.add('is-webview');
    console.info('[播放器] WebView 环境已识别，启用专属动画优化');
  }

  /* =========================================================
   *  基础工具
   * ========================================================= */
  const $ = (id) => document.getElementById(id);
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
  const isDesktop = () => window.matchMedia('(min-width: 881px)').matches;

  function fmtTime(sec) {
    if (!isFinite(sec) || sec < 0) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${String(s).padStart(2, '0')}`;
  }

  function fmtCountdown(ms) {
    const total = Math.max(0, Math.ceil(ms / 1000));
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    return `${m}:${String(s).padStart(2, '0')}`;
  }

  function fmtBytes(bytes) {
    if (!isFinite(bytes) || bytes <= 0) return '0 B';
    const units = ['B', 'KB', 'MB', 'GB'];
    let i = 0;
    let v = bytes;
    while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
    return `${v.toFixed(v >= 100 || i === 0 ? 0 : 1)} ${units[i]}`;
  }

  function cleanName(name) {
    const base = String(name || '').replace(/\.[^.]+$/, '');
    const stripped = base.replace(/^\d{1,3}\s*[-._]\s*(?=\S)/, '').trim();
    return stripped || base.trim() || name;
  }

  function baseName(name) {
    return String(name || '').replace(/\.[^.]+$/, '').toLowerCase().trim();
  }

  function dataUrlMime(dataUrl) {
    const m = /^data:([^;,]+)/i.exec(dataUrl || '');
    return m ? m[1].toLowerCase() : 'image/jpeg';
  }

  function normalizeMime(mime) {
    mime = (mime || '').toLowerCase().trim();
    if (mime === 'image/jpg') return 'image/jpeg';
    return /^image\//.test(mime) ? mime : 'image/jpeg';
  }

  function blobToDataURL(blob) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = () => rej(r.error);
      r.readAsDataURL(blob);
    });
  }

  async function mapLimit(items, limit, fn) {
    const results = new Array(items.length);
    let cursor = 0;
    const workers = [];
    const wc = Math.min(limit, items.length);
    for (let w = 0; w < wc; w++) {
      workers.push((async () => {
        while (cursor < items.length) {
          const idx = cursor++;
          results[idx] = await fn(items[idx], idx);
        }
      })());
    }
    await Promise.all(workers);
    return results;
  }

  function setupViewportVar() {
    const vv = window.visualViewport;
    if (!vv) return;
    const sync = () => {
      document.documentElement.style.setProperty('--vvh', `${Math.round(vv.height)}px`);
    };
    vv.addEventListener('resize', sync);
    vv.addEventListener('scroll', sync);
    sync();
  }

  /* =========================================================
   *  持久化存储申请
   * ========================================================= */
  const STORAGE_FLAG_KEY = 'offline-music-player:persist-granted';
  let persistGranted = false;

  async function ensurePersistentStorage() {
    if (!navigator.storage || !navigator.storage.persist) {
      console.info('[存储] 当前环境不支持持久化申请');
      return false;
    }
    try {
      if (navigator.storage.persisted) {
        const already = await navigator.storage.persisted();
        if (already) {
          persistGranted = true;
          return true;
        }
      }
      if (localStorage.getItem(STORAGE_FLAG_KEY) === '1') {
        try {
          const now = await navigator.storage.persisted();
          if (now) { persistGranted = true; return true; }
        } catch { /* ignore */ }
      }
      const granted = await navigator.storage.persist();
      persistGranted = !!granted;
      if (granted) {
        try { localStorage.setItem(STORAGE_FLAG_KEY, '1'); } catch { /* ignore */ }
        console.info('[存储] 已获得持久化存储权限');
      } else {
        console.warn('[存储] 未获得持久化存储权限，数据可能在存储紧张时被清理');
      }
      return granted;
    } catch (e) {
      console.warn('[存储] 持久化申请失败：', e);
      return false;
    }
  }

  async function checkStorageForFiles(files) {
    const needBytes = files.reduce((sum, f) => sum + (f.size || 0), 0);
    if (!navigator.storage || !navigator.storage.estimate) {
      return { ok: true, needBytes, remainingBytes: Infinity };
    }
    try {
      const est = await navigator.storage.estimate();
      const quota = est.quota || 0;
      const usage = est.usage || 0;
      const remaining = Math.max(0, quota - usage);
      const safeRemaining = remaining * 0.7;
      if (needBytes > safeRemaining) {
        return { ok: false, needBytes, remainingBytes: remaining };
      }
      return { ok: true, needBytes, remainingBytes: remaining };
    } catch {
      return { ok: true, needBytes, remainingBytes: Infinity };
    }
  }

  /* =========================================================
   *  主题 & 星系云团
   * ========================================================= */
  const THEMES = [
    { name: '碧波', accent: '#2dd4bf', accent2: '#22d3ee', deep: '#0d9488', light: '#7df0dd', tint1: '45, 212, 191', tint2: '34, 211, 238', water1: '4, 9, 13', water2: '6, 16, 21' },
    { name: '深海', accent: '#38bdf8', accent2: '#3b82f6', deep: '#0369a1', light: '#7dd3fc', tint1: '56, 189, 248', tint2: '59, 130, 246', water1: '4, 8, 15', water2: '5, 13, 24' },
    { name: '星靛', accent: '#6366f1', accent2: '#818cf8', deep: '#3730a3', light: '#a5b4fc', tint1: '99, 102, 241', tint2: '129, 140, 248', water1: '6, 6, 15', water2: '9, 10, 22' },
    { name: '幽澜', accent: '#a78bfa', accent2: '#c084fc', deep: '#6d28d9', light: '#c4b5fd', tint1: '167, 139, 250', tint2: '192, 132, 252', water1: '9, 6, 16', water2: '13, 8, 23' },
    { name: '霞光', accent: '#f472b6', accent2: '#e879f9', deep: '#be185d', light: '#f9a8d4', tint1: '244, 114, 182', tint2: '232, 121, 249', water1: '12, 6, 12', water2: '17, 7, 16' },
    { name: '珊瑚', accent: '#fb7185', accent2: '#f97316', deep: '#be123c', light: '#fda4af', tint1: '251, 113, 133', tint2: '249, 115, 22', water1: '12, 6, 8', water2: '18, 9, 8' },
    { name: '琥珀', accent: '#fbbf24', accent2: '#f59e0b', deep: '#b45309', light: '#fcd34d', tint1: '251, 191, 36', tint2: '245, 158, 11', water1: '12, 10, 4', water2: '17, 13, 5' },
    { name: '青柠', accent: '#a3e635', accent2: '#84cc16', deep: '#4d7c0f', light: '#bef264', tint1: '163, 230, 53', tint2: '132, 204, 22', water1: '8, 11, 4', water2: '10, 16, 6' },
    { name: '翠竹', accent: '#4ade80', accent2: '#34d399', deep: '#15803d', light: '#86efac', tint1: '74, 222, 128', tint2: '52, 211, 153', water1: '4, 11, 7', water2: '6, 16, 10' }
  ];

  const GALAXY_CLASSES = [
    'galaxy-0', 'galaxy-1', 'galaxy-2', 'galaxy-3', 'galaxy-4',
    'galaxy-5', 'galaxy-6', 'galaxy-7', 'galaxy-8'
  ];

  let themeIndex = 0;
  let galaxyIndex = 0;

  function applyTheme(index) {
    const len = THEMES.length;
    themeIndex = ((index % len) + len) % len;
    const t = THEMES[themeIndex];
    const root = document.documentElement;
    root.style.setProperty('--accent', t.accent);
    root.style.setProperty('--accent-2', t.accent2);
    root.style.setProperty('--accent-deep', t.deep);
    root.style.setProperty('--accent-light', t.light);
    root.style.setProperty('--tint-1', t.tint1);
    root.style.setProperty('--tint-2', t.tint2);
    root.style.setProperty('--water-a', t.water1);
    root.style.setProperty('--water-b', t.water2);
  }

  function nextTheme() { applyTheme(themeIndex + 1); }

  function randomizeGalaxy() {
    const galaxyEl = $('galaxyLayer');
    if (!galaxyEl) return;
    let newIndex;
    do {
      newIndex = Math.floor(Math.random() * GALAXY_CLASSES.length);
    } while (newIndex === galaxyIndex && GALAXY_CLASSES.length > 1);

    galaxyEl.classList.remove(GALAXY_CLASSES[galaxyIndex]);
    galaxyIndex = newIndex;
    galaxyEl.classList.add(GALAXY_CLASSES[galaxyIndex]);
  }

  /* =========================================================
   *  常量
   * ========================================================= */
  const NOTE_SVG = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
         stroke-linecap="round" stroke-linejoin="round">
      <circle cx="8" cy="18" r="3"/><path d="M11 18V5l10-2v13"/><circle cx="18" cy="16" r="3"/>
    </svg>`;

  const MORE_SVG = `
    <svg viewBox="0 0 24 24" fill="currentColor">
      <circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>
    </svg>`;

  const CHECK_SVG = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4"
         stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>`;

  /* =========================================================
   *  音视频类型识别
   * ========================================================= */
  const AUDIO_RE = /\.(mp3|m4a|m4b|aac|flac|wav|wave|ogg|oga|opus|weba|aiff?|ape)$/i;
  const VIDEO_RE = /\.(mp4|m4v|webm|mov|ogv|mkv)$/i;

  function isVideoFile(f) {
    if (f.type && f.type.startsWith('video/')) return true;
    return VIDEO_RE.test(f.name || '');
  }

  function isAudioFile(f) {
    if (isVideoFile(f)) return false;
    if (f.type && f.type.startsWith('audio/')) return true;
    return AUDIO_RE.test(f.name || '');
  }

  /* =========================================================
   *  ID3 解析
   * ========================================================= */
  function deUnsync(u8) {
    const out = new Uint8Array(u8.length);
    let o = 0;
    for (let i = 0; i < u8.length; i++) {
      out[o++] = u8[i];
      if (u8[i] === 0xFF && i + 1 < u8.length && u8[i + 1] === 0x00) i++;
    }
    return out.subarray(0, o);
  }

  function decodeText(u8) {
    if (!u8 || u8.length < 1) return '';
    const enc = u8[0];
    const body = u8.subarray(1);
    let out = '';
    try {
      if (enc === 0) out = new TextDecoder('iso-8859-1').decode(body);
      else if (enc === 1) {
        if (body.length >= 2 && body[0] === 0xFF && body[1] === 0xFE) {
          out = new TextDecoder('utf-16le').decode(body.subarray(2));
        } else if (body.length >= 2 && body[0] === 0xFE && body[1] === 0xFF) {
          out = new TextDecoder('utf-16be').decode(body.subarray(2));
        } else {
          out = new TextDecoder('utf-16le').decode(body);
        }
      } else if (enc === 2) out = new TextDecoder('utf-16be').decode(body);
      else out = new TextDecoder('utf-8').decode(body);
    } catch {
      try { out = new TextDecoder('utf-8').decode(body); } catch { out = ''; }
    }
    return out.replace(/\u0000+$/g, '').replace(/^\u0000+/, '').trim();
  }

  function decodeAPIC(u8) {
    try {
      const enc = u8[0];
      let p = 1, mime = '';
      while (p < u8.length && u8[p] !== 0) mime += String.fromCharCode(u8[p++]);
      p++; if (p >= u8.length) return null;
      p++;
      if (enc === 1 || enc === 2) {
        while (p + 1 < u8.length && !(u8[p] === 0 && u8[p + 1] === 0)) p += 2;
        p += 2;
      } else {
        while (p < u8.length && u8[p] !== 0) p++;
        p++;
      }
      if (p >= u8.length) return null;
      const img = u8.subarray(p);
      if (!img.length) return null;
      return new Blob([img], { type: normalizeMime(mime) });
    } catch { return null; }
  }

  async function parseID3(buffer) {
    const u8 = new Uint8Array(buffer);
    if (u8.length < 10) return null;
    if (u8[0] !== 0x49 || u8[1] !== 0x44 || u8[2] !== 0x33) return null;

    const major = u8[3];
    const flags = u8[5];
    const size = ((u8[6] & 0x7f) << 21) | ((u8[7] & 0x7f) << 14) |
                 ((u8[8] & 0x7f) << 7)  | (u8[9] & 0x7f);
    const end = Math.min(10 + size, u8.length);

    const tagUnsync = major < 4 && (flags & 0x80);
    let body = u8.subarray(10, end);
    if (tagUnsync) body = deUnsync(body);

    let p = 0;
    if ((flags & 0x40) && p + 4 <= body.length) {
      if (major >= 4) {
        const es = ((body[p] & 0x7f) << 21) | ((body[p + 1] & 0x7f) << 14) |
                   ((body[p + 2] & 0x7f) << 7) | (body[p + 3] & 0x7f);
        p += es || 0;
      } else {
        const es = (body[p] << 24) | (body[p + 1] << 16) | (body[p + 2] << 8) | body[p + 3];
        p += 4 + (es || 0);
      }
    }

    const tags = { title: '', artist: '', album: '', cover: null };
    let coverBlob = null;
    const len = body.length;

    while (p + 10 <= len) {
      const id = String.fromCharCode(body[p], body[p + 1], body[p + 2], body[p + 3]);
      if (!/^[A-Z0-9]{4}$/.test(id)) break;

      let fsize;
      if (major >= 4) {
        fsize = ((body[p + 4] & 0x7f) << 21) | ((body[p + 5] & 0x7f) << 14) |
                ((body[p + 6] & 0x7f) << 7)  | (body[p + 7] & 0x7f);
      } else {
        fsize = (body[p + 4] << 24) | (body[p + 5] << 16) | (body[p + 6] << 8) | body[p + 7];
      }
      if (fsize <= 0 || p + 10 + fsize > len) break;

      const flagB = body[p + 9];
      const isV4 = major >= 4;
      const compressed = isV4 ? (flagB & 0x08) : (flagB & 0x80);
      const encrypted  = isV4 ? (flagB & 0x04) : (flagB & 0x40);
      const frameUnsync = isV4 && (flagB & 0x02);

      let data = body.subarray(p + 10, p + 10 + fsize);
      if (frameUnsync) data = deUnsync(data);

      if (!compressed && !encrypted) {
        try {
          if (id === 'TIT2') tags.title = decodeText(data);
          else if (id === 'TPE1') tags.artist = decodeText(data);
          else if (id === 'TALB') tags.album = decodeText(data);
          else if (id === 'APIC' && !coverBlob) coverBlob = decodeAPIC(data);
        } catch { /* 忽略 */ }
      }
      p += 10 + fsize;
    }

    if (coverBlob) {
      try { tags.cover = await blobToDataURL(coverBlob); } catch { /* 忽略 */ }
    }
    return tags;
  }

  async function readTags(file) {
    try {
      const head = new Uint8Array(await file.slice(0, 10).arrayBuffer());
      if (head.length < 10 || head[0] !== 0x49 || head[1] !== 0x44 || head[2] !== 0x33) return null;
      const size = ((head[6] & 0x7f) << 21) | ((head[7] & 0x7f) << 14) |
                   ((head[8] & 0x7f) << 7)  | (head[9] & 0x7f);
      const readSize = Math.min(10 + size, 4 * 1024 * 1024);
      const buf = await file.slice(0, readSize).arrayBuffer();
      return await parseID3(buf);
    } catch { return null; }
  }

  /* =========================================================
   *  视频封面抓取
   * ========================================================= */
  async function extractVideoPoster(blob) {
    return new Promise((resolve) => {
      const url = URL.createObjectURL(blob);
      const v = document.createElement('video');
      let settled = false;
      const cleanup = () => {
        URL.revokeObjectURL(url);
        v.removeAttribute('src');
        try { v.load(); } catch { /* 忽略 */ }
      };
      const finish = (result) => {
        if (settled) return;
        settled = true;
        cleanup();
        resolve(result);
      };
      v.muted = true;
      v.preload = 'auto';
      v.playsInline = true;
      v.setAttribute('playsinline', '');
      v.onloadeddata = () => {
        try { v.currentTime = Math.min(1, Math.max(0.1, (v.duration || 2) * 0.3)); }
        catch { finish(null); }
      };
      v.onseeked = () => {
        try {
          const c = document.createElement('canvas');
          const w = 320;
          const h = Math.max(1, Math.round(w * v.videoHeight / Math.max(1, v.videoWidth)));
          c.width = w;
          c.height = h;
          c.getContext('2d').drawImage(v, 0, 0, w, h);
          finish(c.toDataURL('image/jpeg', 0.82));
        } catch { finish(null); }
      };
      v.onerror = () => finish(null);
      setTimeout(() => finish(null), 12000);
      v.src = url;
    });
  }

  async function shrinkCover(dataUrl, maxSize = 256) {
    if (!dataUrl) return null;
    try {
      const img = await new Promise((res, rej) => {
        const i = new Image();
        i.onload = () => res(i);
        i.onerror = rej;
        i.src = dataUrl;
      });
      if (img.width <= maxSize && img.height <= maxSize) return dataUrl;
      const scale = maxSize / Math.max(img.width, img.height);
      const c = document.createElement('canvas');
      c.width  = Math.max(1, Math.round(img.width  * scale));
      c.height = Math.max(1, Math.round(img.height * scale));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const webp = c.toDataURL('image/webp', 0.82);
      return webp.startsWith('data:image/webp') ? webp : c.toDataURL('image/jpeg', 0.82);
    } catch { return dataUrl; }
  }

  /* =========================================================
   *  IndexedDB
   * ========================================================= */
  const DB_NAME = 'offline-music-player';
  const DB_VER = 3;
  const META_STORE = 'meta';
  const BLOB_STORE = 'blobs';

  let db = null;
  let persistFailed = 0;

  async function initDB() {
    if (!('indexedDB' in window)) return;
    try {
      db = await new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VER);
        req.onupgradeneeded = () => {
          const d = req.result;
          if (!d.objectStoreNames.contains(META_STORE)) d.createObjectStore(META_STORE, { keyPath: 'id' });
          if (!d.objectStoreNames.contains(BLOB_STORE)) d.createObjectStore(BLOB_STORE);
          if (d.objectStoreNames.contains('tracks')) {
            try { d.deleteObjectStore('tracks'); } catch { /* 忽略 */ }
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
        req.onblocked = () => reject(new Error('blocked'));
      });
    } catch (e) {
      console.warn('[播放器] IndexedDB 不可用', e);
      db = null;
    }
  }

  function dbPutMeta(track) {
    if (!db) return Promise.resolve(false);
    return new Promise((resolve) => {
      try {
        const tx = db.transaction(META_STORE, 'readwrite');
        const { blob, _url, ...meta } = track;
        tx.objectStore(META_STORE).put(meta);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => { persistFailed++; resolve(false); };
        tx.onabort = () => { persistFailed++; resolve(false); };
      } catch { resolve(false); }
    });
  }

  function dbPutFull(track) {
    if (!db) return Promise.resolve(false);
    return new Promise((resolve) => {
      try {
        const tx = db.transaction([META_STORE, BLOB_STORE], 'readwrite');
        const { blob, _url, ...meta } = track;
        if (blob) tx.objectStore(BLOB_STORE).put(blob, track.id);
        tx.objectStore(META_STORE).put(meta);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => { persistFailed++; resolve(false); };
        tx.onabort = () => { persistFailed++; resolve(false); };
      } catch { resolve(false); }
    });
  }

  function dbPutMetaBatch(tracks) {
    if (!db || !tracks.length) return Promise.resolve(false);
    return new Promise((resolve) => {
      try {
        const tx = db.transaction(META_STORE, 'readwrite');
        const store = tx.objectStore(META_STORE);
        tracks.forEach((t) => {
          const { blob, _url, ...meta } = t;
          store.put(meta);
        });
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
        tx.onabort = () => resolve(false);
      } catch { resolve(false); }
    });
  }

  function dbDelete(id) {
    if (!db) return Promise.resolve();
    return new Promise((resolve) => {
      try {
        const tx = db.transaction([META_STORE, BLOB_STORE], 'readwrite');
        tx.objectStore(META_STORE).delete(id);
        tx.objectStore(BLOB_STORE).delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => resolve();
        tx.onabort = () => resolve();
      } catch { resolve(); }
    });
  }

  function dbClear() {
    if (!db) return Promise.resolve();
    return new Promise((resolve) => {
      try {
        const tx = db.transaction([META_STORE, BLOB_STORE], 'readwrite');
        tx.objectStore(META_STORE).clear();
        tx.objectStore(BLOB_STORE).clear();
        tx.oncomplete = () => resolve();
        tx.onerror = () => resolve();
        tx.onabort = () => resolve();
      } catch { resolve(); }
    });
  }

  function dbGetAllMeta() {
    if (!db) return Promise.resolve([]);
    return new Promise((resolve) => {
      try {
        const tx = db.transaction(META_STORE, 'readonly');
        const req = tx.objectStore(META_STORE).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => resolve([]);
      } catch { resolve([]); }
    });
  }

  function dbGetBlob(id) {
    if (!db) return Promise.resolve(null);
    return new Promise((resolve) => {
      try {
        const tx = db.transaction(BLOB_STORE, 'readonly');
        const req = tx.objectStore(BLOB_STORE).get(id);

        req.onerror = () => resolve(null);
      } catch { resolve(null); }
    });

  const blobLoading = new Map();
  async function ensureBlob(track) {
    if (!track) return null;
    if (track.blob) return track.blob;
    if (blobLoading.has(track.id)) return blobLoading.get(track.id);
    const p = dbGetBlob(track.id).then((blob) => {
      if (blob) track.blob = blob;
      blobLoading.delete(track.id);
      return blob;
    });
    blobLoading.set(track.id, p);
    return p;

  function syncTab() {
    if (!tabbarEl) return;
    tabbarEl.querySelectorAll('[data-go]').forEach((btn) => {
      const on = Number(btn.dataset.go) === currentPage;
      btn.classList.toggle('on', on);
      btn.setAttribute('aria-selected', on ? 'true' : 'false');
    });

  function goToPage(index, dir) {
    if (isDesktop()) return;
    const N = pageEls.length;
    if (!N) return;
    const next = ((index % N) + N) % N;
    if (next === currentPage) return;

    const from = pageEls[currentPage];
    const to = pageEls[next];
    const d = (dir !== undefined && dir !== 0) ? dir : (next > currentPage ? 1 : -1);

    [from, to].forEach((el) => {
      const t = pageHideTimers.get(el);
      if (t) { clearTimeout(t); pageHideTimers.delete(el); }
    });

    to.style.transition = 'none';
    to.style.visibility = 'visible';
    to.style.opacity = '0';
    to.style.transform = `translateX(${d > 0 ? '100%' : '-100%'}) translateZ(0)`;
    to.style.zIndex = '2';
    from.style.zIndex = '1';
    void to.offsetWidth;

    const trans = 'transform .34s cubic-bezier(.22,.75,.25,1), opacity .28s ease-out';
    to.style.transition = trans;
    to.style.transform = 'translateX(0) translateZ(0)';
    to.style.opacity = '1';
    from.style.transition = trans;
    from.style.transform = `translateX(${d > 0 ? '-42%' : '42%'}) translateZ(0)`;
    from.style.opacity = '0';

    const timer = setTimeout(() => {
      from.style.visibility = 'hidden';
      from.style.transition = 'none';
      from.style.transform = 'translateX(0) translateZ(0)';
      from.style.opacity = '0';
      from.style.zIndex = '0';
      pageHideTimers.delete(from);
    }, 380);
    pageHideTimers.set(from, timer);

    currentPage = next;
    syncTab();
  }

        p.style.opacity = '';

        p.style.transition = '';

      p.style.opacity = on ? '1' : '0';

    });
  }

  function setSleepTimer(minutes) {
    clearSleepTimer();
    if (!minutes || minutes <= 0) {
      toast('定时已关闭');
      return;
    }
    sleepTimerEnd = Date.now() + minutes * 60000;
    updateSleepTimerUI();
    sleepTimerTick = setInterval(tickSleepTimer, 1000);
    toast(`将在 ${minutes} 分钟后暂停`);
  }

  function tickSleepTimer() {
    if (!sleepTimerEnd) return;
    const remain = sleepTimerEnd - Date.now();
    if (remain <= 0) {
      clearSleepTimer();
      const media = getActiveMedia();
      if (media && !media.paused) media.pause();
      toast('定时已到，播放已暂停');
      return;
    }
    updateSleepTimerUI();
  }

  function clearSleepTimer() {
    if (sleepTimerTick) clearInterval(sleepTimerTick);
    sleepTimerTick = null;
    sleepTimerEnd = 0;

        return;

      sleepBtn.classList.add('active');

  function findPair(track, tracks) {
    const base = baseName(track.name);
    if (!base) return null;
    const targetVideo = track.type !== 'video';
    return tracks.find((t) =>
      t.id !== track.id &&
      !t.pairedId &&
      isMediaType(t, targetVideo ? 'video' : 'audio') &&
      baseName(t.name) === base
    ) || null;
  }

  function repairPairs() {
    const tracks = state.tracks;
    tracks.forEach((t) => { if (!t.pairedId) t.pairedId = null; });
    const byBase = new Map();
    tracks.forEach((t) => {
      const b = baseName(t.name);
      if (!b) return;
      if (!byBase.has(b)) byBase.set(b, { audio: null, video: null });
      const e = byBase.get(b);
      if (t.type === 'video') { if (!e.video) e.video = t; }
      else { if (!e.audio) e.audio = t; }
    });
    const toSave = [];
    byBase.forEach(({ audio: a, video: v }) => {
      if (!a || !v) return;
      if (a.pairedId === v.id && v.pairedId === a.id) return;
      if (a.pairedId || v.pairedId) return;
      a.pairedId = v.id;
      v.pairedId = a.id;
      if (!v.title || v.title === cleanName(v.name)) v.title = a.title;
      if (!v.artist || v.artist === '未知艺术家') v.artist = a.artist;
      if (!v.album) v.album = a.album;
      if (!v.cover && a.cover) v.cover = a.cover;
      toSave.push(a, v);
    });
    if (toSave.length) dbPutMetaBatch(toSave);
  }

  function showPopup(anchorEl, html, onClick, opts = {}) {
    popupEl.innerHTML = html;

    popupEl.classList.toggle('is-sheet', sheet);
    popupEl.style.visibility = 'hidden';
    popupEl.style.top = '';
    popupEl.style.left = '';

    if (sheet) {
      sheetBackdrop.hidden = false;
    } else {
      sheetBackdrop.hidden = true;
      const rect = anchorEl.getBoundingClientRect();
      const pw = popupEl.offsetWidth;
      const ph = popupEl.offsetHeight;
      let top = rect.bottom + 6;
      let left = rect.left;
      if (left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8;
      if (top + ph > window.innerHeight - 8) {
        top = rect.top - ph - 6;
        if (top < 8) top = 8;
      }
      if (left < 8) left = 8;
      popupEl.style.top = top + 'px';
      popupEl.style.left = left + 'px';
    }
    popupEl.style.visibility = '';
    popupEl.onclick = (e) => { if (onClick) onClick(e); };
    if (anchorEl === plPicker) plPicker.setAttribute('aria-expanded', 'true');

    setTimeout(() => {
      document.addEventListener('click', onDocClickClose, true);
      if (!sheet) {
